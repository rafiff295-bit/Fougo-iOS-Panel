        def api_validate_license():
         if get_setting("maintenance_mode") == "ON": return jsonify({"ok": False,"error":"MAINTENANCE_MODE","message": get_setting("maintenance_description")}),503
         data = request.get_json(silent=True) or {}
         raw_k = data.get("key") or data.get("key_upper") or ""
         k = re.sub(r"[\s`'\"\u200b\u200c\u200d\ufeff]+", "", str(raw_k)).upper()
         udid = (data.get("udid") or data.get("device") or request.headers.get("User-Agent") or "iOS-Arm64-Device")[:120]
         dev_label = (data.get("device") or udid)[:120]
         rows = db_exec("SELECT * FROM licenses WHERE UPPER(TRIM(key))=?",(k,),fetch=True)
         if not rows:
          restore_cloud_keys()
          rows = db_exec("SELECT * FROM licenses WHERE UPPER(TRIM(key))=?",(k,),fetch=True)
         if not rows and re.match(r"^(?:FOUGO|NOVA|VIP)-[A-Z0-9]{2,10}(?:-[A-Z0-9]{2,10}){1,4}$", k):
          exp_auto = (datetime.datetime.utcnow() + datetime.timedelta(days=30)).strftime("%Y-%m-%d %H:%M:%S UTC")
          db_exec("INSERT OR IGNORE INTO licenses (key,status,duration_days,max_devices,note,created_at,expires_at) VALUES (?,'Active',30,2,'Auto-Restored',?,?)",(k,now_iso(),exp_auto))
          rows = db_exec("SELECT * FROM licenses WHERE UPPER(TRIM(key))=?",(k,),fetch=True)
         if not rows:
          log_event(udid,"auth","invalid_key",f"Key={k}")
          return jsonify({"ok": False,"error":"INVALID_KEY"}),401
         lic = rows[0]
         if lic["status"] != "Active": return jsonify({"ok": False,"error": f"KEY_{lic['status'].upper()}"}),403
         now_dt = datetime.datetime.utcnow()
         days = int(lic["duration_days"] or 30)
         max_dev = int(lic["max_devices"] or 1)
         act_at = lic["activated_at"] or now_iso()
         exp_at = lic["expires_at"]
         if not exp_at:
          exp_at = "Lifetime" if days >= 3650 else (now_dt + datetime.timedelta(days=days)).strftime("%Y-%m-%d %H:%M:%S UTC")
         if exp_at != "Lifetime" and exp_at < now_iso():
          db_exec("UPDATE licenses SET status='Expired' WHERE id=?",(lic["id"],))
          sync_cloud()
          return jsonify({"ok": False,"error":"KEY_EXPIRED"}),403
         act_s = db_exec("SELECT * FROM sessions WHERE license_id=? AND status='Active'",(lic["id"],),fetch=True)
         ex_dev = [s for s in act_s if s["device_info"] == udid]
         if not ex_dev and len(act_s) >= max_dev:
          if max_dev == 1 and len(act_s) == 1:
           db_exec("UPDATE sessions SET device_info=?,last_active=? WHERE id=?",(udid,now_iso(),act_s[0]["id"]))
           ex_dev = [act_s[0]]
          else:
           return jsonify({"ok": False,"error":"DEVICE_LIMIT_REACHED"}),403
         sid = ex_dev[0]["session_id"] if ex_dev else f"SESS-{secrets.token_hex(4).upper()}"
         db_exec("UPDATE licenses SET activated_at=?,expires_at=?,session_id=?,device_info=? WHERE id=?",(act_at,exp_at,sid,udid,lic["id"]))
         db_exec("INSERT OR REPLACE INTO sessions (license_id,license_key,session_id,device_info,created_at,last_active,status) VALUES (?,?,?,?,?,?,'Active')",(lic["id"],k,sid,udid,now_iso(),now_iso()))
         used_count = len(db_exec("SELECT * FROM sessions WHERE license_id=? AND status='Active'",(lic["id"],),fetch=True))
         plan_str = "LIFETIME VIP" if days >= 3650 else f"{days} DAYS VIP"
         if exp_at == "Lifetime": exp_disp = "LIFETIME"
         else:
          try:
           exp_dt = datetime.datetime.strptime(exp_at.replace(" UTC",""),"%Y-%m-%d %H:%M:%S")
           rem_days = max(0,(exp_dt - now_dt).days)
           exp_disp = f"{exp_dt.strftime('%Y-%m-%d')} ({rem_days}d left)"
          except Exception:
           exp_disp = exp_at[:10]
         dlim_s = f"{used_count} / {max_dev}"
         slot_disp = f"SLOT #{used_count} (VERIFIED)"
         vtime_s = now_dt.strftime("%Y-%m-%d %H:%M UTC")
         log_event(k,"license","key_activated",f"Session={sid} UDID={udid[:18]}")
         sync_cloud()
         if owner_id and not ex_dev:
          send_tg(
           owner_id,f"📲 *License Activated on iOS IPA!*\n"
           f"• *Key:* `{k}`\n"
           f"• *Plan:* `{plan_str}`\n"
           f"• *Expires:* `{exp_disp}`\n"
           f"• *Device Limit:* `{dlim_s}`\n"
           f"• *Device:* `{dev_label}`\n"
           f"• *Session:* `{sid}`",)
         return jsonify({
          "ok": True,"status":"ACTIVE","plan": plan_str,"expires_at": exp_at,"expires_display": exp_disp,"device_limit_display": dlim_s,"registered":"YES","device_slot": slot_disp,"session_id": sid,"last_validation": vtime_s,"features": db_exec("SELECT * FROM features ORDER BY display_order ASC",fetch=True),})
