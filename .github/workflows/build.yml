        ]
        if not ff_dirs:
         auto_ff = os.path.join(workspace, "app", "ff_manager")
         os.makedirs(auto_ff, exist_ok=True)
         open(os.path.join(auto_ff, "ProtectedConfig.h"), "w", encoding="utf-8").write("#import <Foundation/Foundation.h>\n")
         ff_dirs = [auto_ff]
        ff_dirs.sort(key=lambda d: (
         0 if os.path.exists(os.path.join(d, "resources")) else 1,
         0 if "fougo external ios project" in d.lower() else 1,
         0 if "ff_manager" in d.lower() else 1,
        ))
        ff_dir = os.path.abspath(ff_dirs[0])
        print(f"Found ff_manager directory: {ff_dir}")
