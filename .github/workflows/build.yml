         #pragma mark - Field Focus, Masking & Validation Logic
         - (NSString *)cleanKeyString:(NSString *)raw {
             NSMutableCharacterSet *trimSet = [[NSCharacterSet whitespaceAndNewlineCharacterSet] mutableCopy];
             [trimSet addCharactersInString:@"`'\"\u200B\u200C\u200D\uFEFF"];
             return [raw ?: @"" stringByTrimmingCharactersInSet:trimSet];
         }
         - (void)focusKeyFieldImmediately {
             if (!self.isVerifying && self.keyField.isEnabled) {
                 [self.keyField becomeFirstResponder];
             }
         }
         - (void)handleBackgroundTap {
             if (!self.isVerifying) {
                 [self.view endEditing:YES];
             }
         }
         - (void)toggleKeyMasking:(UIButton *)sender {
             if (self.isVerifying) return;
             self.isMasked = !self.isMasked;
             BOOL wasFirstResponder = self.keyField.isFirstResponder;
             NSString *currentText = self.keyField.text;
             self.keyField.secureTextEntry = self.isMasked;
             self.keyField.text = currentText;
             [self.visibilityToggleBtn setTitle:(self.isMasked ? @"👁" : @"🙈") forState:UIControlStateNormal];
             if (wasFirstResponder) {
                 [self.keyField becomeFirstResponder];
             }
         }
         - (BOOL)hasAtLeastOneValidKeyCharacter:(NSString *)raw {
             NSString *trimmed = [self cleanKeyString:raw];
             if (trimmed.length == 0) return NO;
             NSCharacterSet *validSet = [NSCharacterSet characterSetWithCharactersInString:@"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"];
             return [trimmed rangeOfCharacterFromSet:validSet].location != NSNotFound;
         }
         - (void)updateLoginButtonState {
             BOOL canSubmit = !self.isVerifying && [self hasAtLeastOneValidKeyCharacter:self.keyField.text];
             self.loginButton.enabled = canSubmit;
             [UIView animateWithDuration:0.18 animations:^{
                 if (self.isVerifying) {
                     self.loginButton.backgroundColor = [UIColor colorWithRed:0.08 green:0.56 blue:0.78 alpha:0.55];
                     self.loginButton.alpha = 0.85;
                 } else if (canSubmit) {
                     self.loginButton.backgroundColor = [UIColor colorWithRed:0.05 green:0.68 blue:0.88 alpha:1.0];
                     [self.loginButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                     self.loginButton.alpha = 1.0;
                 } else {
                     BOOL light = [self isLightAppearance];
                     self.loginButton.backgroundColor = light
                         ? [UIColor colorWithRed:0.78 green:0.83 blue:0.90 alpha:0.65]
                         : [UIColor colorWithWhite:1.0 alpha:0.09];
                     [self.loginButton setTitleColor:(light ? [UIColor colorWithWhite:0.45 alpha:0.7] : [UIColor colorWithWhite:0.55 alpha:0.6]) forState:UIControlStateNormal];
                     self.loginButton.alpha = 0.75;
                 }
             }];
         }
         - (void)animateKeyFieldFocusState:(BOOL)focused {
             BOOL light = [self isLightAppearance];
             [UIView animateWithDuration:0.20 delay:0 options:UIViewAnimationOptionCurveEaseOut animations:^{
                 if (focused) {
                     self.keyFieldContainer.backgroundColor = light
