name: Build Fougo External IPA & Run Telegram Bot
on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Release Version (CFBundleShortVersionString)'
        required: false
        default: '2.4.0'
      build_mode:
        description: 'Packaging Mode (inject-filza or standalone-ipa)'
        required: false
        default: 'inject-filza'
      base_ipa_path:
        description: 'Path to Filza base IPA (e.g. inputs/Filza.ipa)'
        required: false
        default: 'inputs/Filza.ipa'
      bundle_id:
        description: 'CFBundleIdentifier (e.g. com.apple.mobile.MobileHouseArrest)'
        required: false
        default: 'com.apple.mobile.MobileHouseArrest'
      bot_token:
        description: 'Optional: Paste BotFather Token if token in source was reset'
        required: false
        default: ''
      owner_id:
        description: 'Optional: Paste your Telegram Owner ID'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: fougo-external-workflow
  cancel-in-progress: true
jobs:
  build-ipa:
    name: Step 1 - Build Fougo External IPA
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python Imaging & Required Libraries
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install Pillow lief requests flask pyTelegramBotAPI
    - name: Download & Extract iPhoneOS 16.5 SDK
      shell: pwsh
      run: |
        $sdkTarget = Join-Path $env:RUNNER_TEMP "iPhoneOS.sdk"
        if (-not (Test-Path $sdkTarget)) {
          $sdkUrl = "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
          $sdkArchive = Join-Path $env:RUNNER_TEMP "iPhoneOS16.5.sdk.tar.xz"
          $sdkExtract = Join-Path $env:RUNNER_TEMP "sdk_extract"
          New-Item -ItemType Directory -Force -Path $sdkExtract | Out-Null
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkArchive
          tar -xf $sdkArchive -C $sdkExtract
          $extractedSdk = Get-ChildItem -Path $sdkExtract -Directory -Filter "iPhoneOS*.sdk" -Recurse | Select-Object -First 1
          Move-Item -Path $extractedSdk.FullName -Destination $sdkTarget -Force
        }
        echo "IOS_SDK=$sdkTarget" >> $env:GITHUB_ENV
    - name: Compile Login.o + Dashboard.o + Bridge.o & Package IPA
      shell: pwsh
      env:
        INPUT_APP_VERSION: ${{ github.event.inputs.app_version || '2.4.0' }}
        INPUT_BUILD_MODE: ${{ github.event.inputs.build_mode || 'inject-filza' }}
        INPUT_BASE_IPA_PATH: ${{ github.event.inputs.base_ipa_path || 'inputs/Filza.ipa' }}
        INPUT_BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.apple.mobile.MobileHouseArrest' }}
        INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token }}
        INPUT_OWNER_ID: ${{ github.event.inputs.owner_id }}
        SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        SECRET_OWNER_BOT_TOKEN: ${{ secrets.OWNER_BOT_TOKEN }}
        SECRET_TOKEN: ${{ secrets.TOKEN }}
        SECRET_OWNER_ID: ${{ secrets.OWNER_ID }}
        SECRET_TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        SECRET_ADMIN_ID: ${{ secrets.ADMIN_ID }}
        SECRET_CHAT_ID: ${{ secrets.CHAT_ID }}
        VAR_BOT_TOKEN: ${{ vars.BOT_TOKEN }}
        VAR_OWNER_ID: ${{ vars.OWNER_ID }}
        ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        ALL_VARS_JSON: ${{ toJson(vars) }}
        REPO_NAME: ${{ github.repository }}
      run: |
        $ErrorActionPreference = "Stop"
        $pyScript = @'
        import os, sys, glob, shutil, zipfile, plistlib, subprocess, re
        try:
         from PIL import Image
        except ImportError:
         subprocess.run([sys.executable, "-m", "pip", "install", "Pillow"], check=False)
         try:
          from PIL import Image
         except Exception:
          Image = None
        workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
        sdk_path = os.environ.get("IOS_SDK", "").replace("\\", "/")
        if not sdk_path or not os.path.exists(sdk_path):
         sdk_target = os.path.join(os.environ.get("RUNNER_TEMP", workspace), "iPhoneOS.sdk")
         if not os.path.exists(sdk_target):
          print("Downloading iPhoneOS 16.5 SDK automatically...")
          sdk_url = "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
          sdk_arc = os.path.join(os.environ.get("RUNNER_TEMP", workspace), "iPhoneOS16.5.sdk.tar.xz")
          sdk_extr = os.path.join(os.environ.get("RUNNER_TEMP", workspace), "sdk_extr")
          os.makedirs(sdk_extr, exist_ok=True)
          urllib.request.urlretrieve(sdk_url, sdk_arc)
          subprocess.run(["tar", "-xf", sdk_arc, "-C", sdk_extr], check=True)
          for sd in glob.glob(os.path.join(sdk_extr, "**/iPhoneOS*.sdk"), recursive=True):
           if os.path.isdir(sd):
            shutil.move(sd, sdk_target)
            break
         sdk_path = sdk_target.replace("\\", "/")
        repo_slug = os.environ.get("REPO_NAME","fougoexternal/Fougo-Vip-External-iOS").strip()
        os.chdir(workspace)
        for zf in glob.glob("*.zip"):
         print(f"Extracting zip archive: {zf}")
         with zipfile.ZipFile(zf, "r") as z:
          z.extractall(".")
        import urllib.request, json as _json
        DEFAULT_USER_BOT = "8959294066:AAGiMyAwrKgiN6aYLUj4HOl20yINKSHN1Ps"
        DEFAULT_OWNER_BOT = "8819960917:AAG2s6PJVXlMtDhcAqTlsi6WWSew7NvwnCo"
        DEFAULT_SELLER_BOT = "8477980889:AAFQrr7gGrTxrvxl5uW6xI-FcMF6DgygAJs"
        DEFAULT_OWNER_ID = "8245269289"
