             lines = [f"• *{p['display_name']}* (`v{p['version']}`) — *{p['status']}* {'⭐Default' if p['is_default'] else ''}\n  URL: `{p['download_url']}`" for p in profs]
             send_tg(cid,"📲 *iOS CONFIGURATION PROFILES*\n" + "\n".join(lines) + "\n\nCommands:\n• `/addprofile <Name>|<Display>|<Ver>|<URL>|<BtnText>`\n• `/delprofile <Name>`",menu_kb())
            elif data == "menu_themes":
             presets = ["FOUGO EXTERNAL iOS Red","Midnight","Neon","Carbon","Premium Black"]
             kb = [[{"text": f"🎨 {p}","callback_data": f"settheme_{p}"}] for p in presets]
             kb.append([{"text":"⬅️ Back","callback_data":"menu_main"}])
             cur_t = get_setting("theme_preset")
             send_tg(cid,f"🎨 *THEME MANAGEMENT*\nCurrent Preset: `{cur_t}`\nSelect a theme preset below:",kb)
            elif data.startswith("settheme_"):
             tname = data.replace("settheme_","")
             set_setting("theme_preset",tname)
             log_event(uid,"theme","change_preset",tname)
             send_tg(cid,f"🎨 Active Theme switched to *{tname}*!",menu_kb())
            elif data == "toggle_maint":
             cur_m = get_setting("maintenance_mode","OFF")
             new_m = "OFF" if cur_m == "ON" else "ON"
             set_setting("maintenance_mode",new_m)
             log_event(uid,"maintenance",f"set_{new_m}","")
             send_tg(cid,f"🛠 *MAINTENANCE MODE IS NOW: {new_m}*\nTitle: `{get_setting('maintenance_title')}`\nDesc: _{get_setting('maintenance_description')}_\n\nUse `/setmaint <Title>|<Description>|<ReturnTime>` to customize.",menu_kb())
            elif data == "menu_announce":
             anns = db_exec("SELECT * FROM announcements ORDER BY id DESC LIMIT 5",fetch=True)
             lines = [f"• [{a['atype']}] *{a['title']}*: {a['message']}" for a in anns] or ["No announcements yet."]
             send_tg(cid,"📣 *ANNOUNCEMENT SYSTEM*\n" + "\n".join(lines) + "\n\nCreate Announcement:\n`/announce <Type>|<Title>|<Message>`\n_(Types: Global,Update,Maintenance,Important)_",menu_kb())
            elif data == "menu_notify":
             send_tg(cid,"🔔 *NOTIFICATION SYSTEM*\nSend notification to users:\n• `/notify all|<Title>|<Message>`\n• `/notify active|<Title>|<Message>`\n• `/notify <KEY>|<Title>|<Message>`",menu_kb())
            elif data == "menu_logs":
             logs = db_exec("SELECT * FROM activity_logs ORDER BY id DESC LIMIT 15",fetch=True)
             lines = [f"• `{l['created_at'][5:16]}` [{l['category']}] *{l['action']}* ({l['actor']}) {l['details']}" for l in logs] or ["No logs recorded yet."]
             send_tg(cid,"📜 *RECENT ACTIVITY LOGS*\n" + "\n".join(lines) + "\n\nFilter logs: `/logs <category>`",menu_kb())
            elif data == "menu_admins":
             adms = db_exec("SELECT * FROM admins",fetch=True)
             lines = [f"• ID: `{a['telegram_id']}` — Role: *{a['role']}* (`{a['permissions']}`)" for a in adms]
             send_tg(cid,"👮 *OWNER / ADMIN / SUPPORT ROLES*\n" + "\n".join(lines) + "\n\nCommands:\n• `/addadmin <TG_ID> <OWNER|ADMIN|SUPPORT>`\n• `/deladmin <TG_ID>`",menu_kb())
            elif data == "menu_settings":
             send_tg(
              cid,"⚙️ *OWNER PANEL & BRANDING SETTINGS*\n"
              f"• Website Name: `{get_setting('website_name')}`\n"
              f"• Login Title: `{get_setting('login_title')}`\n"
              f"• Owner Username: `{get_setting('owner_username')}`\n"
              f"• Allow Owner in Maintenance: `{get_setting('allow_owner_maintenance')}`\n\n"
              "*Commands:*\n"
              "• `/setowner <new_username> <new_password>`\n"
              "• `/setbrand <WebsiteName>|<LoginTitle>|<Subtitle>`\n"
              "• `/ipa` — Get Direct ESign IPA Link",menu_kb(),)
            continue
           msg = u.get("message") or u.get("edited_message") or {}
           cid = msg.get("chat",{}).get("id")
           uid = msg.get("from",{}).get("id")
           txt = (msg.get("text") or "").strip()
           if not cid or not txt: continue
           role,perms = get_user_role(uid)
           parts = txt.split(maxsplit=1)
           cmd = parts[0].lower().split("@")[0]
           arg = parts[1].strip() if len(parts) > 1 else ""
           if b_mode == "USER" and (not role or cmd in ("/start","/help","/ipa") or txt.upper().startswith("FOUGO-")):
            if txt.upper().startswith("FOUGO-") and not cmd.startswith("/"):
             cmd, arg = "/key", txt.strip().upper()
            if cmd in ("/start","/help","/menu"):
             send_tg(cid,f"👤 *FOUGO EXTERNAL — USER LICENSE PORTAL*\nWelcome! Your Telegram ID: `{uid}`\n\n• Send your `FOUGO-XXXX-XXXX-XXXX` key to check expiration & device status\n• Send `/reset <KEY>` to reset device HWID\n• Send `/ipa` to download the ESign iOS IPA",user_kb)
             continue
            elif cmd == "/ipa":
             send_tg(cid,f"📲 *Direct ESign IPA Download:*\n{ipa_url}",user_kb)
             continue
            elif cmd == "/key":
             rows = db_exec("SELECT * FROM licenses WHERE key=?",(arg.upper(),),fetch=True)
             if not rows: send_tg(cid,"❌ License Key not found.",user_kb)
             else:
              r = rows[0]
              send_tg(cid,f"🔑 *LICENSE STATUS*\n• *Key:* `{r['key']}`\n• *Status:* `{r['status']}`\n• *Plan:* `{r['duration_days']} Days VIP`\n• *Expires:* `{r['expires_at']}`\n• *Device Limit:* `{r['max_devices']}`",user_kb)
             continue
            elif cmd == "/reset":
             k_up = arg.upper()
             rows = db_exec("SELECT * FROM licenses WHERE key=?",(k_up,),fetch=True)
             if not rows: send_tg(cid,"❌ License Key not found.",user_kb)
             else:
              db_exec("UPDATE licenses SET session_id='',device_info='' WHERE key=?",(k_up,))
              db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
              sync_cloud()
              send_tg(cid,f"✅ Device HWID reset complete for key `{k_up}`!",user_kb)
             continue
            elif not role:
             send_tg(cid,"👤 Send your `FOUGO-XXXX-XXXX-XXXX` key to check status, or tap a button below:",user_kb)
             continue
           if not role:
            send_tg(cid,"⛔ *Access Denied*\nUnauthorized Telegram ID (`" + str(uid) + "`).")
            log_event(uid,"security","unauthorized_bot_access",txt[:60])
            continue
           if cmd in ("/start","/help","/menu","/owner","/admin","/seller"):
            target_r = "SELLER" if (cmd == "/seller" or b_mode == "SELLER") else ("ADMIN" if cmd == "/admin" and role == "ADMIN" else role)
            send_tg(cid,stats_txt(uid,target_r),menu_kb(target_r))
           elif cmd == "/addseller":
            if role not in ("OWNER","ADMIN"):
             send_tg(cid,"⛔ Only OWNER or ADMIN can add Sellers.")
             continue
            sp = arg.split()
            if len(sp) >= 1:
             sid = sp[0].strip()
             cr = int(sp[1]) if len(sp) >= 2 and sp[1].isdigit() else 50
             db_exec("INSERT OR REPLACE INTO sellers (telegram_id,username,credits,keys_sold,status,added_at) VALUES (?,?,?,0,'Active',?)",(sid,f"Seller_{sid[-4:]}",cr,now_iso()))
             log_event(uid,"sellers","add_seller",f"{sid} credits={cr}")
             send_tg(cid,f"💼 Added Seller `{sid}` with `{cr} Credits`.",menu_kb(role))
           elif cmd == "/addcredits":
            if role not in ("OWNER","ADMIN"):
             send_tg(cid,"⛔ Only OWNER or ADMIN can top up Seller credits.")
             continue
            sp = arg.split()
            if len(sp) >= 2 and sp[1].lstrip("-").isdigit():
             sid,add_cr = sp[0].strip(),int(sp[1])
             db_exec("UPDATE sellers SET credits = MAX(0, credits + ?) WHERE telegram_id=?",(add_cr,sid))
             new_c = get_seller_credits(sid)
             log_event(uid,"sellers","add_credits",f"{sid} delta={add_cr}")
             send_tg(cid,f"💳 Updated Seller `{sid}` balance (`{add_cr:+d} Cr`). New Balance: `{new_c} Credits`.",menu_kb(role))
           elif cmd == "/delseller":
            if role not in ("OWNER","ADMIN"):
             send_tg(cid,"⛔ Only OWNER or ADMIN can remove Sellers.")
             continue
            sid = arg.strip()
            db_exec("DELETE FROM sellers WHERE telegram_id=?",(sid,))
            send_tg(cid,f"🗑 Removed Seller `{sid}`.",menu_kb(role))
           elif cmd == "/genkey":
            sp = arg.split()
            days = int(sp[0]) if len(sp) >= 1 and sp[0].isdigit() else 30
            qty = int(sp[1]) if len(sp) >= 2 and sp[1].isdigit() else 1
            qty = min(max(qty,1),100)
            max_d = int(sp[2]) if len(sp) >= 3 and sp[2].isdigit() else 1
            note = " ".join(sp[3:]) if len(sp) >= 4 else f"TG-{role}"
            keys,exp = mk_keys(uid,days,qty,max_d,note)
            joined = "\n".join(f"`{k}`" for k in keys[:40])
            send_tg(cid,f"🔑 *Generated {len(keys)} Key(s)* (`{days}d`,MaxDev `{max_d}`):\n\n{joined}",menu_kb())
           elif cmd == "/search":
            rows = db_exec("SELECT * FROM licenses WHERE key LIKE ? OR note LIKE ? LIMIT 20",(f"%{arg}%",f"%{arg}%"),fetch=True)
            lines = [f"• `{r['key']}` — *{r['status']}* | Exp: `{r['expires_at']}` | Dev: `{r['device_info'] or 'None'}`" for r in rows] or ["No matching keys."]
            send_tg(cid,"🔍 *SEARCH RESULTS:*\n" + "\n".join(lines))
           elif cmd == "/key":
            rows = db_exec("SELECT * FROM licenses WHERE key=?",(arg.upper(),),fetch=True)
            if not rows: send_tg(cid,"❌ Key not found.")
            else:
             r = rows[0]
             send_tg(
              cid,f"🔑 *LICENSE DETAILS*\n"
              f"• *Key:* `{r['key']}`\n"
              f"• *Status:* `{r['status']}`\n"
              f"• *Duration:* `{r['duration_days']} days`\n"
              f"• *Max Devices:* `{r['max_devices']}`\n"
              f"• *Created:* `{r['created_at']}`\n"
              f"• *Activated:* `{r['activated_at'] or 'Not yet'}`\n"
              f"• *Expires:* `{r['expires_at']}`\n"
              f"• *Session/Device:* `{r['session_id']}` / `{r['device_info'] or 'None'}`\n"
              f"• *Note:* `{r['note']}`"
             )
           elif cmd in ("/activate","/suspend","/unsuspend","/revoke","/disable","/enable"):
            st_map = {
             "/activate":"Active","/enable":"Active","/unsuspend":"Active","/suspend":"Suspended","/disable":"Disabled","/revoke":"Revoked",}
            new_st = st_map[cmd]
            k_up = arg.upper()
            db_exec("UPDATE licenses SET status=? WHERE key=?",(new_st,k_up))
            log_event(uid,"keys",f"status_{new_st.lower()}",k_up)
            send_tg(cid,f"✅ Key `{k_up}` status updated to *{new_st}*.")
           elif cmd == "/delkey":
            k_up = arg.upper()
            db_exec("DELETE FROM licenses WHERE key=?",(k_up,))
            db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
            log_event(uid,"keys","delete_key",k_up)
            send_tg(cid,f"🗑 Deleted key `{k_up}` and its sessions.")
           elif cmd == "/reset":
            k_up = arg.upper()
            db_exec("UPDATE licenses SET session_id='',device_info='' WHERE key=?",(k_up,))
            db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
            log_event(uid,"keys","device_reset",k_up)
            send_tg(cid,f"🔄 Device & Session reset for key `{k_up}`.")
           elif cmd == "/extend":
            sp = arg.split()
            if len(sp) >= 2 and sp[1].isdigit():
             k_up,add_d = sp[0].upper(),int(sp[1])
             new_exp = (datetime.datetime.utcnow() + datetime.timedelta(days=add_d)).strftime("%Y-%m-%d %H:%M:%S UTC")
             db_exec("UPDATE licenses SET expires_at=?,status='Active' WHERE key=?",(new_exp,k_up))
             log_event(uid,"keys","extend_expiry",f"{k_up} +{add_d}d")
             send_tg(cid,f"⏳ Extended `{k_up}` expiry to `{new_exp}`.")
           elif cmd == "/limit":
            sp = arg.split()
            if len(sp) >= 2 and sp[1].isdigit():
             k_up,lim = sp[0].upper(),int(sp[1])
             db_exec("UPDATE licenses SET max_devices=? WHERE key=?",(lim,k_up))
             log_event(uid,"keys","change_limit",f"{k_up} max={lim}")
             send_tg(cid,f"📱 Updated `{k_up}` device limit to `{lim}`.")
           elif cmd == "/addchannel":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 2:
             btn_t = sp[2] if len(sp) >= 3 else "JOIN CHANNEL"
             db_exec("INSERT INTO channels (title,url,button_text,enabled,display_order) VALUES (?,?,?,1,1)",(sp[0],sp[1],btn_t))
             log_event(uid,"channels","add_channel",sp[0])
             send_tg(cid,f"📢 Added channel *{sp[0]}* (`{sp[1]}`).")
           elif cmd == "/delchannel":
            db_exec("DELETE FROM channels WHERE id=?",(arg,))
            log_event(uid,"channels","del_channel",arg)
            send_tg(cid,f"🗑 Deleted channel ID `{arg}`.")
           elif cmd == "/addfeature":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 3:
             btn_t = sp[3] if len(sp) >= 4 else "ACTIVATE"
             db_exec("INSERT OR REPLACE INTO features (code,title,description,button_text,visible,locked,enabled,display_order) VALUES (?,?,?,?,1,0,1,1)",(sp[0].upper(),sp[1],sp[2],btn_t))
             log_event(uid,"features","add_feature",sp[0].upper())
             send_tg(cid,f"🎛 Added/Updated feature *{sp[1]}* (`{sp[0].upper()}`).")
           elif cmd == "/delfeature":
            db_exec("DELETE FROM features WHERE code=?",(arg.upper(),))
            log_event(uid,"features","del_feature",arg.upper())
            send_tg(cid,f"🗑 Deleted feature `{arg.upper()}`.")
           elif cmd == "/addprofile":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 4:
             btn_t = sp[4] if len(sp) >= 5 else "INSTALL PROFILE"
             db_exec("INSERT OR REPLACE INTO profiles (name,display_name,description,version,install_url,download_url,button_text,status,is_default,display_order,updated_at) VALUES (?,?,?,?,?,?,?,'Active',0,1,?)",(sp[0],sp[1],sp[1],sp[2],sp[3],sp[3],btn_t,now_iso()))
             log_event(uid,"profiles","add_profile",sp[0])
             send_tg(cid,f"📲 Added Configuration Profile *{sp[1]}* (`v{sp[2]}`).")
           elif cmd == "/setmaint":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 2:
             set_setting("maintenance_title",sp[0])
             set_setting("maintenance_description",sp[1])
             if len(sp) >= 3: set_setting("maintenance_return_time",sp[2])
             log_event(uid,"maintenance","update_content",sp[0])
             send_tg(cid,"✅ Maintenance page content updated.")
           elif cmd == "/announce":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 3:
             db_exec("INSERT INTO announcements (atype,title,message,enabled,start_time,end_time) VALUES (?,?,?,1,?,?)",(sp[0],sp[1],sp[2],now_iso(),""))
             log_event(uid,"announcements","create",sp[1])
             send_tg(cid,f"📣 Published *{sp[0]}* announcement: *{sp[1]}*")
           elif cmd == "/notify":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 3:
             db_exec("INSERT INTO notifications (target_type,target_val,title,message,ntype,created_at,read_state) VALUES (?,?,?,?,'info',?,0)",(sp[0],sp[0],sp[1],sp[2],now_iso()))
             log_event(uid,"notifications","send",f"Target={sp[0]} Title={sp[1]}")
             send_tg(cid,f"🔔 Notification dispatched to `{sp[0]}`: *{sp[1]}*")
           elif cmd == "/logs":
            q = f"%{arg}%" if arg else "%"
            rows = db_exec("SELECT * FROM activity_logs WHERE category LIKE ? OR action LIKE ? ORDER BY id DESC LIMIT 20",(q,q),fetch=True)
            lines = [f"• `{r['created_at'][5:16]}` [{r['category']}] *{r['action']}*: `{r['details']}`" for r in rows] or ["No matching logs."]
            send_tg(cid,"📜 *ACTIVITY LOGS*\n" + "\n".join(lines))
           elif cmd == "/addadmin":
            if role != "OWNER":
             send_tg(cid,"⛔ Only OWNER can manage admins.")
             continue
            sp = arg.split()
            if len(sp) >= 2:
             tid,rl = sp[0],sp[1].upper()
             db_exec("INSERT OR REPLACE INTO admins (telegram_id,role,permissions,added_at) VALUES (?,?,?,?)",(tid,rl,"all" if rl == "OWNER" else "default",now_iso()))
             log_event(uid,"admins","add_admin",f"{tid} as {rl}")
             send_tg(cid,f"👮 Added Telegram ID `{tid}` with role *{rl}*.")
           elif cmd == "/deladmin":
            if role != "OWNER":
             send_tg(cid,"⛔ Only OWNER can remove admins.")
             continue
            db_exec("DELETE FROM admins WHERE telegram_id=?",(arg.strip(),))
            send_tg(cid,f"🗑 Removed admin `{arg.strip()}`.")
           elif cmd == "/setowner":
            if role != "OWNER":
             send_tg(cid,"⛔ Only OWNER can change Owner Panel credentials.")
             continue
            sp = arg.split()
            if len(sp) >= 2:
             set_setting("owner_username",sp[0])
             set_setting("owner_password_hash",hash_pw(sp[1]))
             log_event(uid,"owner","change_credentials",sp[0])
             send_tg(cid,f"🔐 Updated `/owner` login username to `{sp[0]}` and hashed new password.")
           elif cmd == "/setbrand":
            sp = [x.strip() for x in arg.split("|")]
            if len(sp) >= 2:
             set_setting("website_name",sp[0])
             set_setting("login_title",sp[1])
             if len(sp) >= 3: set_setting("subtitle",sp[2])
             log_event(uid,"branding","update",sp[0])
             send_tg(cid,"✅ Updated Branding Settings.")
           elif cmd == "/ipa":
            send_tg(cid,f"📲 *Direct ESign IPA Download:*\n{ipa_url}")
           elif cmd == "/status":
            send_tg(cid,stats_txt(),menu_kb())
         except Exception:
          time.sleep(3)
        EOF
