        def mk_keys(actor,days,qty,max_dev=1,note="TG-Admin"):
         created = []
         exp = "Lifetime" if int(days) >= 3650 else (datetime.datetime.utcnow() + datetime.timedelta(days=int(days))).strftime("%Y-%m-%d %H:%M:%S UTC")
         for _ in range(int(qty)):
          k = f"FOUGO-{secrets.token_hex(2).upper()}-{secrets.token_hex(2).upper()}-{secrets.token_hex(2).upper()}"
          db_exec(
           "INSERT INTO licenses (key,status,duration_days,max_devices,note,created_at,expires_at) VALUES (?,'Active',?,?,?,?,?)",(k,int(days),int(max_dev),note,now_iso(),exp),)
          created.append(k)
         log_event(actor,"keys","create_batch",f"Qty={qty} Days={days} MaxDev={max_dev}")
         sync_cloud()
         return created,exp

