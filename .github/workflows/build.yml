        static UIView*g_MaintV=nil;static UIButton*g_HubBtn=nil;static id g_LogDel=nil;static id g_DshDel=nil;static NSString*g_LStat=@"ACTIVE" ;static NSString*g_LPlan=@"30 DAYS VIP" ;static NSString*g_LExp=@"—" ;
        static NSString*g_LDLim=@"1 / 1" ;static NSString*g_DReg=@"YES" ;static NSString*g_DSlot=@"SLOT #1 (VERIFIED)" ;static NSString*g_SessId=@"SESS-ACTIVE" ;static NSString*g_LVal=@"JUST NOW" ;static NSDictionary*g_Cloud=nil;
        static NSString*g_Tunnel=nil;static NSTimeInterval g_SyncTs=0;static UIColor*FougoColorFromHex(NSString*hex,UIColor*fallback){if(!hex||hex.length<6)return fallback;NSString*clean=[[hex stringByTrimmingCharactersInSet:WS_SET] uppercaseString];
