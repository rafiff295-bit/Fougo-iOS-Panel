        def get_seller_credits(uid_s):
         r = db_exec("SELECT credits FROM sellers WHERE telegram_id=? OR (username != '' AND LOWER(username)=?)",(str(uid_s),str(uid_s).lstrip("@").lower()),fetch=True)
