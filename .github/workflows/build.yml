        def get_user_role(uid, username=""):
         uid_s = str(uid) if uid else ""
         u_clean = (username or "").lstrip("@").lower()
         if owner_id and uid_s == str(owner_id): return "OWNER",ROLE_PERMS["OWNER"]
         # Check sellers
         s_rows = db_exec("SELECT * FROM sellers WHERE (telegram_id=? OR (username != '' AND LOWER(REPLACE(username,'@',''))=?)) AND status='Active'",(uid_s,u_clean),fetch=True) if (uid_s or u_clean) else []
         if s_rows:
          if uid_s and s_rows[0]["telegram_id"] != uid_s and not s_rows[0]["telegram_id"].isdigit():
           db_exec("UPDATE sellers SET telegram_id=? WHERE username=?",(uid_s,s_rows[0]["username"]))
           sync_cloud()
          return "SELLER",ROLE_PERMS["SELLER"]
         # Check admins
         rows = db_exec("SELECT * FROM admins WHERE (telegram_id=? OR (username != '' AND LOWER(REPLACE(username,'@',''))=?))",(uid_s,u_clean),fetch=True) if (uid_s or u_clean) else []
         if rows:
          if uid_s and rows[0]["telegram_id"] != uid_s and not rows[0]["telegram_id"].isdigit():
           db_exec("UPDATE admins SET telegram_id=? WHERE username=?",(uid_s,rows[0]["username"]))
           sync_cloud()
          r_role = rows[0]["role"].upper()
          perms_raw = rows[0]["permissions"]
          if perms_raw == "all" or r_role == "OWNER": return r_role,ROLE_PERMS["OWNER"]
          if r_role == "SELLER": return "SELLER",ROLE_PERMS["SELLER"]
          custom = {p.strip() for p in perms_raw.split(",") if p.strip()}
          return r_role,(custom or ROLE_PERMS.get(r_role,set()))
         # Fallback if brand new database with no admins
         all_adm = db_exec("SELECT * FROM admins",fetch=True)
         if not all_adm and not owner_id and uid_s:
          db_exec("INSERT INTO admins (telegram_id,username,role,permissions,added_at) VALUES (?,?,'OWNER','all',?)",(uid_s,u_clean,now_iso()))
          sync_cloud()
          return "OWNER",ROLE_PERMS["OWNER"]
         return None,set()

