name: Build Fougo External IPA & Run Telegram Bot
on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Optional: Paste BotFather Token if token in source was reset'
        required: false
        default: ''
      owner_id:
        description: 'Optional: Paste your Telegram Owner ID'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build-ipa:
    name: Step 1 - Build Fougo External IPA
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python Imaging Libraries
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install Pillow
    - name: Download & Extract iPhoneOS 16.5 SDK
      shell: pwsh
      run: |
        $sdkTarget = Join-Path $env:RUNNER_TEMP "iPhoneOS.sdk"
        if (-not (Test-Path $sdkTarget)) {
          $sdkUrl = "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
          $sdkArchive = Join-Path $env:RUNNER_TEMP "iPhoneOS16.5.sdk.tar.xz"
          $sdkExtract = Join-Path $env:RUNNER_TEMP "sdk_extract"
          New-Item -ItemType Directory -Force -Path $sdkExtract | Out-Null
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkArchive
          tar -xf $sdkArchive -C $sdkExtract
          $extractedSdk = Get-ChildItem -Path $sdkExtract -Directory -Filter "iPhoneOS*.sdk" -Recurse | Select-Object -First 1
          Move-Item -Path $extractedSdk.FullName -Destination $sdkTarget -Force
        }
        echo "IOS_SDK=$sdkTarget" >> $env:GITHUB_ENV
    - name: Compile Login.o + Dashboard.o + Bridge.o & Package IPA
      shell: pwsh
      env:
        INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token }}
        INPUT_OWNER_ID: ${{ github.event.inputs.owner_id }}
        REPO_NAME: ${{ github.repository }}
      run: |
        $ErrorActionPreference = "Stop"
        $pyScript = @'
        import os, sys, glob, shutil, zipfile, plistlib, subprocess, re
        from PIL import Image
        workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
        sdk_path = os.environ["IOS_SDK"].replace("\\","/")
        repo_slug = os.environ.get("REPO_NAME","fougoexternal/Fougo-Vip-External-iOS").strip()
        os.chdir(workspace)
        for zf in glob.glob("*.zip"):
         print(f"Extracting zip archive: {zf}")
         with zipfile.ZipFile(zf, "r") as z:
          z.extractall(".")
        det_tok = os.environ.get("INPUT_BOT_TOKEN","").strip()
        det_oid = os.environ.get("INPUT_OWNER_ID","").strip()
        for fp in (
         glob.glob("**/*.py", recursive=True)
         + glob.glob("**/*.h", recursive=True)
         + glob.glob("**/*.m", recursive=True)
         + glob.glob("**/*.ps1", recursive=True)
         + glob.glob("**/*.json", recursive=True)
         + glob.glob("**/*.md", recursive=True)
        ):
         if "__MACOSX" in fp or not os.path.isfile(fp): continue
         try:
          txt = open(fp, "r", encoding="utf-8", errors="replace").read()
          if not det_tok:
           m_tok = re.search(r"(\d{8,12}:[A-Za-z0-9_-]{30,50})", txt)
           if m_tok:
            det_tok = m_tok.group(1).strip()
          if not det_oid:
           m_oid = re.search(r"(?:OWNER_ID|ADMIN_ID|CHAT_ID|owner_id|admin_id|OwnerId)\s*[:=]\s*['\"]?(\d{6,15})['\"]?", txt)
           if m_oid:
            det_oid = m_oid.group(1).strip()
         except Exception:
          pass
        ff_dirs = [
         os.path.dirname(p)
         for p in (
          glob.glob("**/app/ff_manager/Info.plist", recursive=True)
          + glob.glob("**/ff_manager/Info.plist", recursive=True)
          + glob.glob("**/dashboard page.m", recursive=True)
          + glob.glob("**/login page.m", recursive=True)
          + glob.glob("**/main.m", recursive=True)
         )
         if "__MACOSX" not in p
        ]
        if not ff_dirs:
         raise RuntimeError("Could not find app/ff_manager directory in repository!")
        ff_dir = os.path.abspath(ff_dirs[0])
        print(f"Found ff_manager directory: {ff_dir}")
        p1_h = os.path.join(ff_dir, "ProtectedConfig 1.h")
        p2_h = os.path.join(ff_dir, "ProtectedConfig 2.h")
        p_def = os.path.join(ff_dir, "ProtectedConfig.h")
        p_login_h = os.path.join(ff_dir, "ProtectedConfig_Login.h")
        p_dash_h = os.path.join(ff_dir, "ProtectedConfig_Dash.h")
        if os.path.exists(p1_h):
         shutil.copy2(p1_h, p_login_h)
        elif os.path.exists(p_def):
         shutil.copy2(p_def, p_login_h)
        if os.path.exists(p2_h):
         shutil.copy2(p2_h, p_dash_h)
         shutil.copy2(p2_h, p_def)
        elif os.path.exists(p1_h):
         shutil.copy2(p1_h, p_dash_h)
         shutil.copy2(p1_h, p_def)
        for icon_script in ("generate_fougo_external_icon.py","generate_app_icons.py"):
         sp = os.path.join(ff_dir, icon_script)
         if os.path.exists(sp):
          subprocess.run([sys.executable, sp], cwd=ff_dir, check=False)
        clean_root = os.path.join(workspace, "clean_root")
        shutil.rmtree(clean_root, ignore_errors=True)
        app_dir = os.path.join(clean_root, "Payload","FougoExternal.app")
        os.makedirs(app_dir, exist_ok=True)
        src_plist_path = os.path.join(ff_dir, "Info.plist")
        pl = {}
        if os.path.exists(src_plist_path):
         try:
          with open(src_plist_path, "rb") as fp:
           pl = plistlib.load(fp)
         except Exception:
          pl = {}
        exec_n = pl.get("CFBundleExecutable","FougoExternal")
        exec_p = os.path.join(app_dir, exec_n)
        clang_candidates = [
         r"C:\Program Files\LLVM\bin\clang.exe",
         r"C:\msys64\mingw64\bin\clang.exe","clang",
        ]
        clang_bin = next((c for c in clang_candidates if shutil.which(c) or os.path.exists(c)), "clang")
        common_flags = [
         "-target","arm64-apple-ios14.0","-isysroot", sdk_path,
         f"-F{sdk_path}/System/Library/Frameworks",
         f"-L{sdk_path}/usr/lib","-ObjC","-fobjc-arc","-Wno-everything",
         f"-I{ff_dir}",
        ]
        link_flags = [
         "-fuse-ld=lld","-Wl,-adhoc_codesign","-framework","Foundation","-framework","UIKit","-framework","QuartzCore","-framework","CoreGraphics","-framework","CoreText","-framework","CoreImage","-framework","Security","-framework","WebKit","-framework","AVFoundation","-framework","AudioToolbox","-framework","SystemConfiguration","-framework","Metal","-framework","MetalKit","-framework","ImageIO","-framework","CoreFoundation","-framework","UniformTypeIdentifiers","-lobjc","-lsqlite3","-lz","-lc++",
        ]
        dash_p = os.path.join(ff_dir, "dashboard page.m")
        login_p = os.path.join(ff_dir, "login page.m")
        if os.path.exists(login_p) and os.path.exists(dash_p):
         login_raw = open(login_p, "r", encoding="utf-8", errors="replace").read()
         dash_raw = open(dash_p, "r", encoding="utf-8", errors="replace").read()
         dash_src = re.sub(r'#import\s+"ProtectedConfig[^"]*"', '#import "ProtectedConfig_Dash.h"', dash_raw)
         dash_src = re.sub(r"\bint\s+main\s*\(","int fougo_dash_entry_main(", dash_src)
         all_dash_vcs = [
          m.group(1)
          for m in re.finditer(r"@interface\s+([A-Za-z_]\w*)\s*:\s*(?:UIViewController|UITableViewController|UINavigationController)", dash_src)
         ]
         dash_dels = [
          m.group(1)
          for m in re.finditer(r"@interface\s+([A-Za-z_]\w*)\s*:\s*\w+\s*<\s*UIApplicationDelegate", dash_src)
         ]
         dash_del_name = dash_dels[-1] if dash_dels else ""
         best_vc = ""
         best_score = -1
         dash_init_sel = ""
         for vc_cand in all_dash_vcs:
          m_impl = re.search(rf"@implementation\s+{re.escape(vc_cand)}\b(.*?)@end", dash_src, re.S)
          body_txt = m_impl.group(1) if m_impl else ""
          score = len(body_txt)
          u_body = body_txt.upper()
          if "NECK" in u_body or "BODY" in u_body:
           score += 500000
          if any(excl in vc_cand.lower() for excl in ("color","picker","modal","popup","alert","splash")):
           score -= 250000
          if score > best_score:
           best_score = score
           best_vc = vc_cand
           for m_meth in re.finditer(r"-\s*\(\s*void\s*\)\s*([A-Za-z_]\w*)\s*\{", body_txt):
            m_name = m_meth.group(1)
            if m_name in ("viewDidLoad","viewWillAppear","viewDidAppear","viewWillLayoutSubviews","viewDidLayoutSubviews","dealloc"): continue
            if any(k in m_name.lower() for k in ("dash","main","panel","menu","setup","build","show","unlock","enter","load","initui")):
             dash_init_sel = m_name
             break
         dash_vc_name = best_vc or (all_dash_vcs[-1] if all_dash_vcs else "")
         APPLE_PREFIXES = ("UI","NS","CA","CG","CI","WK","AV","MT","CF","SC","SK","MK","CL","UT")
         l_clss = sorted(
          set(
           m.group(1)
           for m in re.finditer(r"@interface\s+([A-Za-z_]\w*)\s*:\s*[A-Za-z_]\w*", login_raw)
           if not m.group(1).startswith(APPLE_PREFIXES)
          ),
          key=len,
          reverse=True,
         )
         login_src = re.sub(r'#import\s+"ProtectedConfig[^"]*"', '#import "ProtectedConfig_Login.h"', login_raw)
         login_src = re.sub(r"\bint\s+main\s*\(","int fougo_login_entry_main(", login_src)
         for cls_name in l_clss:
          login_src = re.sub(rf"\b{cls_name}\b", f"FougoLogin_{cls_name}", login_src)
         login_src = re.sub(
          r"(@(?:interface|implementation)\s+[A-Za-z_]\w*\s*\(\s*)([A-Za-z_]\w*)(\s*\))",
          r"\1FougoLogin_\2\3",
          login_src,
         )
         login_vcs = [
          m.group(1)
          for m in re.finditer(r"@interface\s+([A-Za-z_]\w*)\s*:\s*(?:UIViewController|UITableViewController|UINavigationController)", login_src)
          if not any(excl in m.group(1).lower() for excl in ("color","picker","modal","popup","alert"))
         ]
         login_dels = [
          m.group(1)
          for m in re.finditer(r"@interface\s+([A-Za-z_]\w*)\s*:\s*\w+\s*<\s*UIApplicationDelegate", login_src)
         ]
         login_vc_name = login_vcs[-1] if login_vcs else ""
         login_del_name = login_dels[-1] if login_dels else ""
         print(f"All Dash VCs: {all_dash_vcs} -> Selected Dash VC={dash_vc_name} (init_sel={dash_init_sel}), Dash Del={dash_del_name}")
         print(f"Detected Login classes: {l_clss} -> Login VC={login_vc_name}, Login Del={login_del_name}")
         login_m_file = os.path.join(ff_dir, "fougo_unit_login.m")
         dash_m_file = os.path.join(ff_dir, "fougo_unit_dash.m")
         bridge_m_file = os.path.join(ff_dir, "fougo_unit_bridge.m")
         login_o_file = os.path.join(ff_dir, "fougo_unit_login.o")
         dash_o_file = os.path.join(ff_dir, "fougo_unit_dash.o")
         bridge_o_file = os.path.join(ff_dir, "fougo_unit_bridge.o")
         open(login_m_file, "w", encoding="utf-8").write(login_src)
         open(dash_m_file, "w", encoding="utf-8").write(dash_src)
         bridge_code = r'''
        #import <UIKit/UIKit.h>
        #import <Foundation/Foundation.h>
