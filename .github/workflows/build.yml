        def get_user_role(uid):
         uid_s = str(uid)
         if owner_id and uid_s == str(owner_id): return "OWNER",ROLE_PERMS["OWNER"]
         s_rows = db_exec("SELECT * FROM sellers WHERE telegram_id=? AND status='Active'",(uid_s,),fetch=True)
         rows = db_exec("SELECT * FROM admins WHERE telegram_id=?",(uid_s,),fetch=True)
         if not rows and s_rows:
          return "SELLER",ROLE_PERMS["SELLER"]
         if not rows:
          all_adm = db_exec("SELECT * FROM admins",fetch=True)
          if not all_adm and not owner_id:
           db_exec("INSERT INTO admins (telegram_id,role,permissions,added_at) VALUES (?,'OWNER','all',?)",(uid_s,now_iso()))
           return "OWNER",ROLE_PERMS["OWNER"]
          return None,set()
         role = rows[0]["role"].upper()
         perms_raw = rows[0]["permissions"]
         if perms_raw == "all" or role == "OWNER": return role,ROLE_PERMS["OWNER"]
         if role == "SELLER": return "SELLER",ROLE_PERMS["SELLER"]
         custom = {p.strip() for p in perms_raw.split(",") if p.strip()}
         return role,(custom or ROLE_PERMS.get(role,set()))
