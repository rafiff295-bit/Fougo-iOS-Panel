        def api_owner_action():
         data = request.get_json(silent=True) or {}
         act = data.get("action") or ""
         if act == "gen_keys":
          days = int(data.get("days") or 30)
          qty = min(max(int(data.get("qty") or 1),1),100)
          max_d = int(data.get("max_devices") or 1)
          keys,exp = mk_keys("OWNER",days,qty,max_d,"Web-Owner")
          return jsonify({"ok": True,"keys": keys,"expires": exp})
         if act == "add_seller":
          sid = str(data.get("seller_id") or "").strip()
          cr = int(data.get("credits") or 50)
          if sid:
           db_exec("INSERT OR REPLACE INTO sellers (telegram_id,username,credits,keys_sold,status,added_at) VALUES (?,?,?,0,'Active',?)",(sid,f"Seller_{sid[-4:]}",cr,now_iso()))
           sync_cloud()
           return jsonify({"ok": True})
         if act == "add_credits":
          sid = str(data.get("seller_id") or "").strip()
          cr = int(data.get("credits") or 0)
          if sid:
           db_exec("UPDATE sellers SET credits = MAX(0, credits + ?) WHERE telegram_id=?",(cr,sid))
           sync_cloud()
           return jsonify({"ok": True,"credits": get_seller_credits(sid)})
         if act == "reset_hwid":
          k_up = str(data.get("key") or "").strip().upper()
          db_exec("UPDATE licenses SET session_id='',device_info='' WHERE key=?",(k_up,))
          db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
          sync_cloud()
          return jsonify({"ok": True})
         if act == "toggle_maint":
          cur_m = get_setting("maintenance_mode","OFF")
          new_m = "OFF" if cur_m == "ON" else "ON"
          set_setting("maintenance_mode",new_m)
          sync_cloud()
          return jsonify({"ok": True,"maintenance": new_m})
         return jsonify({"ok": False,"error":"UNKNOWN_ACTION"}),400
