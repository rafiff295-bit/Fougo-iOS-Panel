         try:
          u_url = f"https://api.telegram.org/bot{b_tok}/getUpdates?timeout=15&offset={offsets.get(b_tok,0)}"
          with urllib.request.urlopen(u_url,timeout=22) as resp:
           res = json.loads(resp.read().decode("utf-8")).get("result",[])
           if res:
            offsets[b_tok] = res[-1]["update_id"] + 1
           return [(b_mode, b_tok, item) for item in res]
         except Exception:
          return []
