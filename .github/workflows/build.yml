          send_tg(cid,"🗂 *MY SELLER KEYS (Last 15)*\n\n" + "\n".join(lines),menu_kb("SELLER"),tok_override=b_tok)
          return

         # User Bot commands
         if b_mode == "USER" and (not role or cmd in ("/start","/help","/ipa") or txt.upper().startswith("FOUGO-")):
          if txt.upper().startswith("FOUGO-") and not cmd.startswith("/"):
           cmd, arg = "/key", txt.strip().upper()
          if cmd in ("/start","/help","/menu"):
           send_tg(cid,f"👤 *FOUGO EXTERNAL — USER LICENSE PORTAL*\nWelcome! Your Telegram ID: `{uid}`\n\n• Send your `FOUGO-XXXX-XXXX-XXXX` key to check expiration & device status\n• Tap buttons below:",user_kb,tok_override=b_tok)
           return
          elif cmd == "/ipa":
           send_tg(cid,f"📲 *Direct ESign IPA Download:*\n{ipa_url}",user_kb,tok_override=b_tok)
           return
          elif cmd == "/key":
           rows = db_exec("SELECT * FROM licenses WHERE key=?",(arg.upper(),),fetch=True)
           if not rows: send_tg(cid,"❌ License Key not found in system.",user_kb,tok_override=b_tok)
           else:
            r = rows[0]
            send_tg(cid,f"""🔑 *LICENSE STATUS*
        • *Key:* `{r['key']}`
        • *Status:* `{r['status']}`
        • *Plan:* `{r['duration_days']} Days VIP`
        • *Expires:* `{r['expires_at']}`
        • *Device Limit:* `{r['max_devices']}`""",user_kb,tok_override=b_tok)
           return
          elif cmd == "/reset":
           k_up = arg.upper()
           rows = db_exec("SELECT * FROM licenses WHERE key=?",(k_up,),fetch=True)
           if not rows: send_tg(cid,"❌ License Key not found.",user_kb,tok_override=b_tok)
           else:
            db_exec("UPDATE licenses SET session_id='',device_info='' WHERE key=?",(k_up,))
            db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
            sync_cloud()
            send_tg(cid,f"✅ Device HWID reset complete for key `{k_up}`!",user_kb,tok_override=b_tok)
           return
          elif not role:
           send_tg(cid,"👤 Send your `FOUGO-XXXX-XXXX-XXXX` key to check status, or tap a button below:",user_kb,tok_override=b_tok)
           return

         # Seller Bot checks
         if b_mode == "SELLER" or cmd in ("/seller", "/wallet"):
          if role in ("SELLER", "OWNER", "ADMIN"):
           send_tg(cid,stats_txt(uid,"SELLER"),menu_kb("SELLER"),reply_kb=SELLER_BOTTOM_KEYBOARD,tok_override=b_tok)
           return
          else:
           send_tg(cid,f"⛔ *Access Denied — Seller Authorization Required*\n\n👤 *Your Telegram ID:* `{uid}`\n🏷 *Your Username:* `@{username or 'None'}`\n\nPlease share your Telegram ID (`{uid}`) with Owner to get added with 1 tap.",tok_override=b_tok)
           return

         # Access control for Owner Bot
         if not role:
          send_tg(cid,f"⛔ *Access Denied*\n\n👤 *Your Telegram ID:* `{uid}`\n🏷 *Your Username:* `@{username or 'None'}`\n\nPlease ask Owner to add you with 1 tap.",tok_override=b_tok)
          log_event(uid,"security","unauthorized_access",txt[:60])
          return

         # Fallback Slash Commands (for backwards compatibility)
         if cmd in ("/start","/help","/menu","/owner","/admin"):
          target_r = "ADMIN" if cmd == "/admin" and role == "ADMIN" else role
          send_tg(cid,stats_txt(uid,target_r),menu_kb(target_r),reply_kb=MAIN_BOTTOM_KEYBOARD if target_r in ("OWNER","ADMIN") else SELLER_BOTTOM_KEYBOARD,tok_override=b_tok)
         elif cmd == "/addseller":
          if role not in ("OWNER","ADMIN"):
           send_tg(cid,"⛔ Only OWNER or ADMIN can add Sellers.",menu_kb(role),tok_override=b_tok)
           return
          sp = arg.split()
          if len(sp) >= 1:
           target_raw = sp[0].strip()
           init_cr = int(sp[1]) if len(sp) >= 2 and sp[1].isdigit() else 100
           clean_id = target_raw.lstrip("@")
           if target_raw.isdigit():
            db_exec("INSERT OR REPLACE INTO sellers (telegram_id,username,credits,keys_sold,status,added_at) VALUES (?,?,?,0,'Active',?)",(target_raw,"",init_cr,now_iso()))
           else:
            db_exec("INSERT OR REPLACE INTO sellers (telegram_id,username,credits,keys_sold,status,added_at) VALUES (?,?,?,0,'Active',?)",(clean_id,clean_id,init_cr,now_iso()))
           sync_cloud()
           send_tg(cid,f"✅ *Seller Added Successfully!*\n• ID/Username: `{target_raw}`\n• Starting Balance: `{init_cr} Credits`",menu_kb(role),tok_override=b_tok)
          else:
           USER_STATE[uid] = {"action":"awaiting_seller_input"}
           send_tg(cid,"💼 *Send the seller's Telegram User ID or @username:*\n_(No `/` command needed)_",[ [{"text":"❌ Cancel","callback_data":"menu_sellers"}] ],tok_override=b_tok)
         elif cmd == "/addcredits":
          sp = arg.split()
          if len(sp) >= 2 and sp[1].isdigit():
           target_raw, amt = sp[0].strip(), int(sp[1])
           clean_id = target_raw.lstrip("@")
           db_exec("UPDATE sellers SET credits = credits + ? WHERE telegram_id=? OR (username != '' AND LOWER(username)=?)",(amt,clean_id,clean_id.lower()))
           sync_cloud()
           r_cr = db_exec("SELECT credits FROM sellers WHERE telegram_id=? OR (username != '' AND LOWER(username)=?)",(clean_id,clean_id.lower()),fetch=True)
           bal = r_cr[0]["credits"] if r_cr else amt
           send_tg(cid,f"✅ *Recharged {amt} Credits for Seller `{target_raw}`!*\nNew Total Balance: `{bal} Credits`",menu_kb(role),tok_override=b_tok)
         elif cmd == "/delseller":
          if arg:
           clean_id = arg.strip().lstrip("@")
           db_exec("DELETE FROM sellers WHERE telegram_id=? OR username=?",(clean_id,clean_id))
           sync_cloud()
           send_tg(cid,f"🗑 Seller `{arg}` has been removed.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/addadmin":
          if role != "OWNER":
           send_tg(cid,"⛔ Only OWNER can add admins.",menu_kb(role),tok_override=b_tok)
           return
          sp = arg.split()
          if len(sp) >= 1:
           target_raw = sp[0].strip()
           req_r = sp[1].upper() if len(sp) >= 2 and sp[1].upper() in ("OWNER","ADMIN","SUPPORT") else "ADMIN"
           clean_id = target_raw.lstrip("@")
           if target_raw.isdigit():
            db_exec("INSERT OR REPLACE INTO admins (telegram_id,username,role,permissions,added_at) VALUES (?,?,?,?,?)",(target_raw,"",req_r,"all",now_iso()))
           else:
            db_exec("INSERT OR REPLACE INTO admins (telegram_id,username,role,permissions,added_at) VALUES (?,?,?,?,?)",(clean_id,clean_id,req_r,"all",now_iso()))
           sync_cloud()
           send_tg(cid,f"✅ *Admin Added Successfully!*\n• ID/Username: `{target_raw}`\n• Role: *{req_r}*",menu_kb(role),tok_override=b_tok)
          else:
           USER_STATE[uid] = {"action":"awaiting_admin_input"}
           send_tg(cid,"👮 *Send the admin's Telegram User ID or @username:*\n_(No `/` command needed)_",[ [{"text":"❌ Cancel","callback_data":"menu_admins"}] ],tok_override=b_tok)
         elif cmd == "/deladmin":
          if role != "OWNER":
           send_tg(cid,"⛔ Only OWNER can remove admins.",menu_kb(role),tok_override=b_tok)
           return
          if arg:
           clean_id = arg.strip().lstrip("@")
           db_exec("DELETE FROM admins WHERE telegram_id=? OR username=?",(clean_id,clean_id))
           sync_cloud()
           send_tg(cid,f"🗑 Admin `{arg}` has been removed.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/genkey":
          sp = arg.split()
          days = int(sp[0]) if len(sp) >= 1 and sp[0].isdigit() else 30
          qty = int(sp[1]) if len(sp) >= 2 and sp[1].isdigit() else 1
          qty = min(max(qty,1),100)
          max_d = int(sp[2]) if len(sp) >= 3 and sp[2].isdigit() else 1
          note = " ".join(sp[3:]) if len(sp) >= 4 else f"TG-{role}"
          keys,exp = mk_keys(uid,days,qty,max_d,note)
          preview = "\n".join(f"`{k}`" for k in keys[:30])
          more = f"\n_...and {len(keys)-30} more keys_" if len(keys) > 30 else ""
          send_tg(cid,f"✅ *Generated {len(keys)} License Key(s)*\n⏳ *Duration:* `{days} Days` (`{exp}`)\n📱 *Device Limit:* `{max_d}`\n\n{preview}{more}",menu_kb(role),tok_override=b_tok)
         elif cmd == "/search":
          q = f"%{arg.strip()}%"
          rows = db_exec("SELECT * FROM licenses WHERE key LIKE ? OR note LIKE ? OR session_id LIKE ? ORDER BY id DESC LIMIT 15",(q,q,q),fetch=True)
          lines = [f"• `{r['key']}` — *{r['status']}* ({r['duration_days']}d)" for r in rows] or ["No keys matched."]
          send_tg(cid,f"🔍 *Search results for '{arg}':*\n" + "\n".join(lines),menu_kb(role),tok_override=b_tok)
         elif cmd == "/key":
          k_up = arg.upper()
          rows = db_exec("SELECT * FROM licenses WHERE key=?",(k_up,),fetch=True)
          if not rows: send_tg(cid,"❌ License Key not found.",menu_kb(role),tok_override=b_tok)
          else:
           r = rows[0]
           send_tg(cid,f"""🔑 *LICENSE DETAILS*
        • *Key:* `{r['key']}`
        • *Status:* `{r['status']}`
        • *Duration:* `{r['duration_days']} days`
        • *Max Devices:* `{r['max_devices']}`
        • *Created:* `{r['created_at']}`
        • *Activated:* `{r['activated_at'] or 'Not yet'}`
        • *Expires:* `{r['expires_at']}`
        • *Session/Device:* `{r['session_id']}` / `{r['device_info'] or 'None'}`
        • *Note:* `{r['note']}`""",menu_kb(role),tok_override=b_tok)
         elif cmd in ("/activate","/suspend","/unsuspend","/revoke","/disable","/enable"):
          st_map = {"/activate":"Active","/enable":"Active","/unsuspend":"Active","/suspend":"Suspended","/disable":"Disabled","/revoke":"Revoked"}
          new_st = st_map[cmd]
          k_up = arg.upper()
          db_exec("UPDATE licenses SET status=? WHERE key=?",(new_st,k_up))
          log_event(uid,"keys",f"status_{new_st.lower()}",k_up)
          send_tg(cid,f"✅ Key `{k_up}` status updated to *{new_st}*.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/delkey":
          k_up = arg.upper()
          db_exec("DELETE FROM licenses WHERE key=?",(k_up,))
          db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
          log_event(uid,"keys","delete_key",k_up)
          send_tg(cid,f"🗑 Deleted key `{k_up}` and its sessions.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/reset":
          k_up = arg.upper()
          db_exec("UPDATE licenses SET session_id='',device_info='' WHERE key=?",(k_up,))
          db_exec("DELETE FROM sessions WHERE license_key=?",(k_up,))
          log_event(uid,"keys","device_reset",k_up)
          send_tg(cid,f"🔄 Device & Session reset for key `{k_up}`.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/extend":
          sp = arg.split()
          if len(sp) >= 2 and sp[1].isdigit():
           k_up,add_d = sp[0].upper(),int(sp[1])
           new_exp = (datetime.datetime.utcnow() + datetime.timedelta(days=add_d)).strftime("%Y-%m-%d %H:%M:%S UTC")
           db_exec("UPDATE licenses SET expires_at=?,status='Active' WHERE key=?",(new_exp,k_up))
           log_event(uid,"keys","extend_expiry",f"{k_up} +{add_d}d")
           send_tg(cid,f"⏳ Extended `{k_up}` expiry to `{new_exp}`.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/limit":
          sp = arg.split()
          if len(sp) >= 2 and sp[1].isdigit():
           k_up,lim = sp[0].upper(),int(sp[1])
           db_exec("UPDATE licenses SET max_devices=? WHERE key=?",(lim,k_up))
           log_event(uid,"keys","change_limit",f"{k_up} max={lim}")
           send_tg(cid,f"📱 Updated `{k_up}` device limit to `{lim}`.",menu_kb(role),tok_override=b_tok)
         elif cmd == "/logs":
          q = f"%{arg}%" if arg else "%"
          rows = db_exec("SELECT * FROM activity_logs WHERE category LIKE ? OR action LIKE ? ORDER BY id DESC LIMIT 20",(q,q),fetch=True)
          lines = [f"• `{r['created_at'][5:16]}` [{r['category']}] *{r['action']}*: `{r['details']}`" for r in rows] or ["No matching logs."]
          send_tg(cid,"📜 *ACTIVITY LOGS*\n" + "\n".join(lines),menu_kb(role),tok_override=b_tok)
         elif cmd == "/ipa":
          send_tg(cid,f"📲 *Direct ESign IPA Download:*\n{ipa_url}",tok_override=b_tok)
         elif cmd == "/status":
          send_tg(cid,stats_txt(uid,role),menu_kb(role),tok_override=b_tok)

        # Ultra-Fast Independent Bot Worker Threads (Zero Blocking, Zero Lag)
        start_ts = time.time()
        print("Starting 24/7 Ultra-Fast Multi-Bot Polling Engine (Owner Bot + Seller Bot + User Bot)...")

        def run_bot_worker(b_mode, b_tok):
         offset = 0
         print(f"[{b_mode} Bot] Live high-speed polling worker started.")
         while (time.time() - start_ts) < 340 * 60:
          try:
           u_url = f"https://api.telegram.org/bot{b_tok}/getUpdates?timeout=1&limit=50&offset={offset}"
           req = urllib.request.Request(u_url, headers={"User-Agent": "FougoBotEngine/3.0"})
           with urllib.request.urlopen(req, timeout=5) as resp:
            data = json.loads(resp.read().decode("utf-8"))
            updates = data.get("result", [])
            for u in updates:
             offset = max(offset, u["update_id"] + 1)
             try:
              handle_bot_update(b_mode, b_tok, u)
             except Exception as ex_ev:
              print(f"[{b_mode}] Update handling error:", ex_ev)
          except urllib.error.HTTPError as he:
           time.sleep(2)
          except Exception:
           time.sleep(0.5)

        # Spawn separate listener threads for each bot
        for bm, bt in bot_pool:
         threading.Thread(target=run_bot_worker, args=(bm, bt), daemon=True, name=f"Worker-{bm}").start()

        # Keep main thread alive
        while (time.time() - start_ts) < 340 * 60:
         time.sleep(2)
        print("Bot polling session completed normally.")
        EOF
