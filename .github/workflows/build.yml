        oid_env_list = [
         os.environ.get(k, "").strip()
         for k in ("INPUT_OWNER_ID", "SECRET_OWNER_ID", "SECRET_TELEGRAM_OWNER_ID", "SECRET_ADMIN_ID", "SECRET_CHAT_ID", "VAR_OWNER_ID")
