name: Build Fougo External .ipa

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Release Version (CFBundleShortVersionString)'
        required: false
        default: '2.4.0'
      build_mode:
        description: 'Packaging Mode (inject-filza or standalone-ipa)'
        required: false
        default: 'inject-filza'
      telegram_notify:
        description: 'Send compiled .ipa to Telegram Bot after build'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile Objective-C & Package .ipa
    runs-on: macos-14
    timeout-minutes: 25

    env:
      APP_NAME: "FougoExternal"
      BUNDLE_ID: "com.fougo.external.manager"
      APP_VERSION: ${{ github.event.inputs.app_version || '2.4.0' }}
      BUILD_NUMBER: "${{ github.run_number }}"
      MIN_IOS_VERSION: "15.0"
      FRAMEWORK_NAME: "FougoExternal"
      BASE_IPA_PATH: "inputs/Filza.ipa"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 & Build Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install macOS Packaging & Injection Toolchain
        run: |
          brew update
          brew install ldid dylibbundler cmake
          echo "SDK Path: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Normalize Source Tree Spaces & Run Bridge Obfuscator
        working-directory: app/ff_manager
        run: |
          if [ -f "ProtectedConfig 1.h" ] && [ ! -f "ProtectedConfig.h" ]; then
            cp "ProtectedConfig 1.h" "ProtectedConfig.h"
          fi
          if [ -f "protect_bridge.py" ]; then
            python3 protect_bridge.py
          fi
          if [ -f "update_plist_version.py" ]; then
            python3 update_plist_version.py --version "${APP_VERSION}" --build "${BUILD_NUMBER}"
          fi

      - name: Compile Objective-C Sources (arm64)
        working-directory: app/ff_manager
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build

          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=${MIN_IOS_VERSION} \
            -isysroot "${SDK_PATH}" \
            -fobjc-arc -fmodules \
            -dynamiclib \
            -install_name "@rpath/${FRAMEWORK_NAME}.framework/${FRAMEWORK_NAME}" \
            -I. \
            "login page.m" \
            "dashboard page.m" \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework WebKit \
            -o "build/${FRAMEWORK_NAME}"

      - name: Assemble ${FRAMEWORK_NAME}.framework Bundle
        working-directory: app/ff_manager
        run: |
          FW_DIR="build/${FRAMEWORK_NAME}.framework"
          mkdir -p "${FW_DIR}"
          cp "build/${FRAMEWORK_NAME}" "${FW_DIR}/${FRAMEWORK_NAME}"
          if [ -f "FrameworkInfo.plist" ]; then
            cp "FrameworkInfo.plist" "${FW_DIR}/Info.plist"
          fi
          if [ -d "resources/offline" ]; then
            mkdir -p "${FW_DIR}/offline"
            cp -R resources/offline/*.fougoexternal "${FW_DIR}/offline/" || true
          fi

      - name: Package & Inject .ipa Archive
        run: |
          mkdir -p release Payload_Work
          MODE="${{ github.event.inputs.build_mode || 'inject-filza' }}"

          if [ "${MODE}" = "inject-filza" ] && [ -f "${BASE_IPA_PATH}" ]; then
            unzip -q "${BASE_IPA_PATH}" -d Payload_Work
            APP_BUNDLE=$(find Payload_Work/Payload -name "*.app" -maxdepth 1 | head -n 1)
          else
            APP_BUNDLE="Payload_Work/Payload/${APP_NAME}.app"
            mkdir -p "${APP_BUNDLE}"
            cp "app/ff_manager/Info.plist" "${APP_BUNDLE}/Info.plist"

            SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
            cat << 'EOF' > /tmp/main_host.m
          #import <UIKit/UIKit.h>
          #import <dlfcn.h>
          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  dlopen("@executable_path/Frameworks/FougoExternal.framework/FougoExternal", RTLD_NOW);
                  return UIApplicationMain(argc, argv, nil, nil);
              }
          }
          EOF
            xcrun -sdk iphoneos clang -arch arm64 \
              -miphoneos-version-min=${MIN_IOS_VERSION} \
              -isysroot "${SDK_PATH}" \
              -fobjc-arc /tmp/main_host.m \
              -framework UIKit -framework Foundation \
              -rpath "@executable_path/Frameworks" \
              -o "${APP_BUNDLE}/${APP_NAME}"
          fi

          mkdir -p "${APP_BUNDLE}/Frameworks"
          cp -R "app/ff_manager/build/${FRAMEWORK_NAME}.framework" "${APP_BUNDLE}/Frameworks/"
          if [ -d "app/ff_manager/resources/offline" ]; then
            mkdir -p "${APP_BUNDLE}/offline"
            cp -R app/ff_manager/resources/offline/*.fougoexternal "${APP_BUNDLE}/offline/" || true
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "${APP_BUNDLE}/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${APP_BUNDLE}/Info.plist" || true

      - name: Code Sign Bundle (ldid-adhoc)
        run: |
          APP_BUNDLE=$(find Payload_Work/Payload -name "*.app" -maxdepth 1 | head -n 1)
          find "${APP_BUNDLE}/Frameworks" -type f -name "${FRAMEWORK_NAME}" -exec ldid -S {} +
          ldid -S "${APP_BUNDLE}"

      - name: Compress Payload into Final .ipa Artifact
        run: |
          cd Payload_Work
          IPA_FILENAME="${APP_NAME}_v${APP_VERSION}_b${BUILD_NUMBER}.ipa"
          zip -qry "../release/${IPA_FILENAME}" Payload
          cd ..
          shasum -a 256 release/*.ipa > release/SHA256SUMS.txt

      - name: Upload .ipa to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-ipa
          path: |
            release/*.ipa
            release/SHA256SUMS.txt
          retention-days: 30

      - name: Dispatch .ipa to Telegram Bot Server
        if: ${{ (github.event.inputs.telegram_notify == 'true' || github.event_name == 'push') && secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IPA_FILE=$(ls release/*.ipa | head -n 1)
          SHA_HASH=$(awk '{print $1}' release/SHA256SUMS.txt | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${IPA_FILE}" \
            -F "caption=✅ *Fougo External iOS Build Ready*%0AVersion: \`v${APP_VERSION} (${BUILD_NUMBER})\`%0AMode: \`inject-filza\`%0ASHA-256: \`${SHA_HASH}\`" \
            -F "parse_mode=Markdown"

      - name: Publish GitHub Release with .ipa Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: "${{ env.APP_NAME }} v${{ env.APP_VERSION }} (Build #${{ github.run_number }})"
          body: |
            ### Fougo External iOS Build Artifact
            - **Bundle Identifier**: `${{ env.BUNDLE_ID }}`
            - **Target Architecture**: `arm64` (Min iOS ${{ env.MIN_IOS_VERSION }})
            - **Packaging Mode**: `inject-filza`
            - **Signing**: `ldid-adhoc`
            - **Offline Resources**: `BODY.fougoexternal`, `NECK.fougoexternal`
          files: |
            release/*.ipa
            release/SHA256SUMS.txt
