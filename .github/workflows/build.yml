        clean_root = os.path.join(workspace, "clean_root")
        shutil.rmtree(clean_root, ignore_errors=True)

        # Check for Filza base IPA in inputs/, root workspace, or base_ipa_input
        filza_candidates = [
            base_ipa_input,
            os.path.join(workspace, base_ipa_input),
            os.path.join(workspace, "inputs", "Filza.ipa"),
            os.path.join(workspace, "inputs", "filza.ipa"),
        ]
        inputs_dir = os.path.join(workspace, "inputs")
        if os.path.exists(inputs_dir):
            for f in os.listdir(inputs_dir):
                if f.lower().endswith(".ipa"):
                    filza_candidates.insert(0, os.path.join(inputs_dir, f))
        for f in os.listdir(workspace):
            if f.lower().endswith(".ipa") and not f.startswith("."):
                filza_candidates.append(os.path.join(workspace, f))

        found_filza = next((p for p in filza_candidates if os.path.exists(p) and os.path.isfile(p)), None)
        is_filza_injection = (build_mode == "inject-filza") and (found_filza is not None)

        if is_filza_injection:
            print(f"[*] INJECT-FILZA MODE: Extracting base IPA from: {found_filza}")
            with zipfile.ZipFile(found_filza, "r") as z_base:
                z_base.extractall(clean_root)
            payload_p = os.path.join(clean_root, "Payload")
            app_cands = [os.path.join(payload_p, d) for d in os.listdir(payload_p) if d.endswith(".app")] if os.path.exists(payload_p) else []
            if app_cands:
                app_dir = app_cands[0]
                print(f"[*] Target host app found in base Filza IPA: {app_dir}")
            else:
                app_dir = os.path.join(clean_root, "Payload", "FougoExternal.app")
                os.makedirs(app_dir, exist_ok=True)
        else:
            if build_mode == "inject-filza":
                print("[!] INJECT-FILZA requested, but no Filza.ipa found in inputs/ (or base_ipa_path).")
