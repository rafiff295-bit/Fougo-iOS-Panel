         - (BOOL)textFieldShouldReturn:(UITextField *)textField {
             if ([self hasAtLeastOneValidKeyCharacter:textField.text] && !self.isVerifying) {
                 [self handleLoginSubmission:self.loginButton];
                 return YES;
             }
             return NO;
         }
         - (void)triggerFieldErrorShakeAndRefocus:(NSString *)errorText {
             self.inlineErrorLabel.text = ([errorText isKindOfClass:[NSString class]] && errorText.length > 0) ? errorText : @"Invalid License Key";
             self.keyFieldContainer.layer.borderColor = [UIColor colorWithRed:1.0 green:0.32 blue:0.42 alpha:0.90].CGColor;
             [UIView animateWithDuration:0.16 animations:^{
                 self.inlineErrorLabel.alpha = 1.0;
             }];
             CAKeyframeAnimation *shake = [CAKeyframeAnimation animationWithKeyPath:@"transform.translation.x"];
             shake.timingFunction = [CAMediaTimingFunction functionWithName:kCAMediaTimingFunctionEaseInEaseOut];
             shake.duration = 0.36;
             shake.values = @[@(-9.0), @(9.0), @(-7.0), @(7.0), @(-4.0), @(4.0), @(0.0)];
             [self.keyFieldContainer.layer addAnimation:shake forKey:@"fougo_error_shake"];
             dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.08 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                 if (self.keyField.isEnabled && self.view.window) {
                     [self.keyField becomeFirstResponder];
                 }
             });
         }
         - (void)handleLoginSubmission:(UIButton *)sender {
             if (self.isVerifying) return;
             NSString *trimmedKey = [self cleanKeyString:self.keyField.text];
             if (![self hasAtLeastOneValidKeyCharacter:trimmedKey]) {
                 return;
             }
             self.keyField.text = trimmedKey;
             [self.view endEditing:YES];
             self.isVerifying = YES;
             self.keyField.enabled = NO;
             self.visibilityToggleBtn.enabled = NO;
             self.loginButton.enabled = NO;
             self.inlineErrorLabel.alpha = 0.0;
             [self.loginButton setTitle:@"" forState:UIControlStateNormal];
             [self.loadingSpinner startAnimating];
             [self updateLoginButtonState];
             __weak typeof(self) weakSelf = self;
             void (^finishVerification)(BOOL, NSString *) = [^(BOOL isValid, NSString *errMsg) {
                 dispatch_async(dispatch_get_main_queue(), ^{
                     __strong typeof(weakSelf) strongSelf = weakSelf;
                     if (!strongSelf) return;
                     if (isValid) {
                         [strongSelf.loadingSpinner stopAnimating];
                         [UIView animateWithDuration:0.22 animations:^{
                             strongSelf.successGlassBanner.alpha = 1.0;
                             strongSelf.keyFieldContainer.layer.borderColor = [UIColor colorWithRed:0.18 green:0.95 blue:0.75 alpha:0.90].CGColor;
                         }];
                         dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.38 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                             id appDel = [UIApplication sharedApplication].delegate;
                             SEL goDashSel = NSSelectorFromString(@"goDash");
                             if ([appDel respondsToSelector:goDashSel]) {
                                 #pragma clang diagnostic push
                                 #pragma clang diagnostic ignored "-Warc-performSelector-leaks"
                                 [appDel performSelector:goDashSel];
                                 #pragma clang diagnostic pop
                             }
                         });
                     } else {
                         strongSelf.isVerifying = NO;
                         strongSelf.keyField.enabled = YES;
                         strongSelf.visibilityToggleBtn.enabled = YES;
                         [strongSelf.loadingSpinner stopAnimating];
                         [strongSelf.loginButton setTitle:@"LOGIN" forState:UIControlStateNormal];
                         [strongSelf updateLoginButtonState];
                         [strongSelf triggerFieldErrorShakeAndRefocus:([errMsg isKindOfClass:[NSString class]] && errMsg.length > 0 ? errMsg : @"Invalid License Key")];
                     }
                 });
             } copy];
             id appDel = [UIApplication sharedApplication].delegate;
             SEL verifySel = NSSelectorFromString(@"fougoVerifyKey:completion:");
             if ([appDel respondsToSelector:verifySel]) {
                 ((void (*)(id, SEL, NSString *, void (^)(BOOL, NSString *)))[appDel methodForSelector:verifySel])(appDel, verifySel, trimmedKey, finishVerification);
                 return;
             }
             dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.55 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                 BOOL passesFormat = (trimmedKey.length >= 8 && [trimmedKey containsString:@"-"]);
                 finishVerification(passesFormat, @"Invalid License Key");
             });
         }
         #pragma mark - Keyboard Avoidance
         - (void)registerKeyboardNotifications {
             [[NSNotificationCenter defaultCenter] addObserver:self
                                                      selector:@selector(handleKeyboardFrameChange:)
                                                          name:UIKeyboardWillChangeFrameNotification
                                                        object:nil];
             [[NSNotificationCenter defaultCenter] addObserver:self
                                                      selector:@selector(handleKeyboardWillHide:)
                                                          name:UIKeyboardWillHideNotification
                                                        object:nil];
         }
         - (void)handleKeyboardFrameChange:(NSNotification *)note {
             if (!self.isViewLoaded || !self.view.window) return;
             NSDictionary *info = note.userInfo;
             CGRect endFrame = [info[UIKeyboardFrameEndUserInfoKey] CGRectValue];
             CGRect localKeyboard = [self.view convertRect:endFrame fromView:nil];
             CGFloat overlap = MAX(0.0, CGRectGetMaxY(self.view.bounds) - CGRectGetMinY(localKeyboard));
             NSTimeInterval dur = [info[UIKeyboardAnimationDurationUserInfoKey] doubleValue] ?: 0.25;
             [UIView animateWithDuration:dur animations:^{
                 self.scrollView.contentInset = UIEdgeInsetsMake(0, 0, overlap + 20.0, 0);
                 if (overlap > 40.0) {
                     CGFloat shiftY = MIN(overlap * 0.42, 95.0);
                     self.cardGlassView.transform = CGAffineTransformMakeTranslation(0, -shiftY);
                 } else {
                     self.cardGlassView.transform = CGAffineTransformIdentity;
                 }
             }];
         }
         - (void)handleKeyboardWillHide:(NSNotification *)note {
             if (!self.isViewLoaded || !self.view.window) return;
             NSTimeInterval dur = [note.userInfo[UIKeyboardAnimationDurationUserInfoKey] doubleValue] ?: 0.25;
             [UIView animateWithDuration:dur animations:^{
                 self.scrollView.contentInset = UIEdgeInsetsZero;
                 self.cardGlassView.transform = CGAffineTransformIdentity;
             }];
         }
