name: Build Fougo External IPA & Run Telegram Bot
on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Optional: Paste BotFather Token if token in source was reset'
        required: false
        default: ''
      owner_id:
        description: 'Optional: Paste your Telegram Owner ID'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: fougo-external-workflow
  cancel-in-progress: true
jobs:
  build-ipa:
    name: Step 1 - Build Fougo External IPA
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python Imaging Libraries
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install Pillow lief
    - name: Download & Extract iPhoneOS 16.5 SDK
      shell: pwsh
      run: |
        $sdkTarget = Join-Path $env:RUNNER_TEMP "iPhoneOS.sdk"
        if (-not (Test-Path $sdkTarget)) {
          $sdkUrl = "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
          $sdkArchive = Join-Path $env:RUNNER_TEMP "iPhoneOS16.5.sdk.tar.xz"
          $sdkExtract = Join-Path $env:RUNNER_TEMP "sdk_extract"
          New-Item -ItemType Directory -Force -Path $sdkExtract | Out-Null
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkArchive
          tar -xf $sdkArchive -C $sdkExtract
          $extractedSdk = Get-ChildItem -Path $sdkExtract -Directory -Filter "iPhoneOS*.sdk" -Recurse | Select-Object -First 1
          Move-Item -Path $extractedSdk.FullName -Destination $sdkTarget -Force
        }
        echo "IOS_SDK=$sdkTarget" >> $env:GITHUB_ENV
    - name: Compile Login.o + Dashboard.o + Bridge.o & Package IPA
      shell: pwsh
      env:
        INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token }}
        INPUT_OWNER_ID: ${{ github.event.inputs.owner_id }}
        SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        SECRET_OWNER_BOT_TOKEN: ${{ secrets.OWNER_BOT_TOKEN }}
        SECRET_TOKEN: ${{ secrets.TOKEN }}
        SECRET_OWNER_ID: ${{ secrets.OWNER_ID }}
        SECRET_TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        SECRET_ADMIN_ID: ${{ secrets.ADMIN_ID }}
        SECRET_CHAT_ID: ${{ secrets.CHAT_ID }}
        VAR_BOT_TOKEN: ${{ vars.BOT_TOKEN }}
        VAR_OWNER_ID: ${{ vars.OWNER_ID }}
        ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        ALL_VARS_JSON: ${{ toJson(vars) }}
        REPO_NAME: ${{ github.repository }}
      run: |
        $ErrorActionPreference = "Stop"
        $pyScript = @'
        import os, sys, glob, shutil, zipfile, plistlib, subprocess, re
        from PIL import Image
        workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
        sdk_path = os.environ["IOS_SDK"].replace("\\","/")
        repo_slug = os.environ.get("REPO_NAME","fougoexternal/Fougo-Vip-External-iOS").strip()
        os.chdir(workspace)
        for zf in glob.glob("*.zip"):
         print(f"Extracting zip archive: {zf}")
         with zipfile.ZipFile(zf, "r") as z:
          z.extractall(".")
        import urllib.request, json as _json
        DEFAULT_USER_BOT = "8959294066:AAGiMyAwrKgiN6aYLUj4HOl20yINKSHN1Ps"
        DEFAULT_OWNER_BOT = "8819960917:AAG2s6PJVXlMtDhcAqTlsi6WWSew7NvwnCo"
        DEFAULT_SELLER_BOT = "8477980889:AAFQrr7gGrTxrvxl5uW6xI-FcMF6DgygAJs"
        DEFAULT_OWNER_ID = "8245269289"
        tok_env_list = [
         os.environ.get(k, "").strip()
         for k in ("INPUT_BOT_TOKEN", "SECRET_BOT_TOKEN", "SECRET_TELEGRAM_BOT_TOKEN", "SECRET_OWNER_BOT_TOKEN", "SECRET_TOKEN", "VAR_BOT_TOKEN")
         if os.environ.get(k, "").strip()
        ] + [DEFAULT_OWNER_BOT, DEFAULT_USER_BOT, DEFAULT_SELLER_BOT]
        oid_env_list = [
         os.environ.get(k, "").strip()
         for k in ("INPUT_OWNER_ID", "SECRET_OWNER_ID", "SECRET_TELEGRAM_OWNER_ID", "SECRET_ADMIN_ID", "SECRET_CHAT_ID", "VAR_OWNER_ID")
         if os.environ.get(k, "").strip()
        ] + [DEFAULT_OWNER_ID]
        for j_env in ("ALL_SECRETS_JSON", "ALL_VARS_JSON"):
         raw_j = os.environ.get(j_env, "")
         if raw_j:
          for m_t in re.finditer(r"(\d{8,12}:[A-Za-z0-9_-]{30,50})", raw_j):
           tv = m_t.group(1).strip()
           if tv not in tok_env_list: tok_env_list.append(tv)
          try:
           j_obj = _json.loads(raw_j)
           if isinstance(j_obj, dict):
            for sk, sv in j_obj.items():
             sv_s = str(sv or "").strip()
             if re.fullmatch(r"\d{6,15}", sv_s) and any(w in sk.upper() for w in ("OWNER", "ADMIN", "CHAT", "USER", "ID")):
              if sv_s not in oid_env_list: oid_env_list.append(sv_s)
          except Exception:
           pass
        det_tok = tok_env_list[0] if tok_env_list else ""
        det_oid = oid_env_list[0] if oid_env_list else ""
        tok_cands = list(dict.fromkeys(tok_env_list))
        for fp in (
         glob.glob("**/*.py", recursive=True)
         + glob.glob("**/*.h", recursive=True)
         + glob.glob("**/*.m", recursive=True)
         + glob.glob("**/*.ps1", recursive=True)
         + glob.glob("**/*.json", recursive=True)
         + glob.glob("**/*.md", recursive=True)
        ):
         if "__MACOSX" in fp or not os.path.isfile(fp): continue
         try:
          txt = open(fp, "r", encoding="utf-8", errors="replace").read()
          for m_tok in re.finditer(r"(\d{8,12}:[A-Za-z0-9_-]{30,50})", txt):
           tc = m_tok.group(1).strip()
           if tc not in tok_cands: tok_cands.append(tc)
          if not det_oid:
           m_oid = re.search(r"(?:OWNER_ID|ADMIN_ID|CHAT_ID|owner_id|admin_id|OwnerId)\s*[:=]\s*['\"]?(\d{6,15})['\"]?", txt)
           if m_oid:
            det_oid = m_oid.group(1).strip()
         except Exception:
          pass
        for tc in tok_cands:
         try:
          with urllib.request.urlopen(f"https://api.telegram.org/bot{tc}/getMe", timeout=8) as r:
           if _json.loads(r.read().decode("utf-8")).get("ok"):
            det_tok = tc
            break
         except Exception:
          pass
        if not det_tok and tok_cands:
         det_tok = tok_cands[0]
        ff_dirs = [
         os.path.dirname(p)
         for p in (
          glob.glob("**/app/ff_manager/Info.plist", recursive=True)
          + glob.glob("**/ff_manager/Info.plist", recursive=True)
          + glob.glob("**/dashboard page.m", recursive=True)
          + glob.glob("**/login page.m", recursive=True)
          + glob.glob("**/main.m", recursive=True)
         )
         if "__MACOSX" not in p
        ]
        if not ff_dirs:
         auto_ff = os.path.join(workspace, "app", "ff_manager")
         os.makedirs(auto_ff, exist_ok=True)
         open(os.path.join(auto_ff, "ProtectedConfig.h"), "w", encoding="utf-8").write("#import <Foundation/Foundation.h>\n")
         ff_dirs = [auto_ff]
        ff_dirs.sort(key=lambda d: (
         0 if os.path.exists(os.path.join(d, "resources")) else 1,
         0 if "fougo external ios project" in d.lower() else 1,
         0 if "ff_manager" in d.lower() else 1,
        ))
        ff_dir = os.path.abspath(ff_dirs[0])
        print(f"Found ff_manager directory: {ff_dir}")
        p1_h = os.path.join(ff_dir, "ProtectedConfig 1.h")
        p2_h = os.path.join(ff_dir, "ProtectedConfig 2.h")
        p_def = os.path.join(ff_dir, "ProtectedConfig.h")
        p_login_h = os.path.join(ff_dir, "ProtectedConfig_Login.h")
        p_dash_h = os.path.join(ff_dir, "ProtectedConfig_Dash.h")
        if os.path.exists(p1_h):
         shutil.copy2(p1_h, p_login_h)
        elif os.path.exists(p_def):
         shutil.copy2(p_def, p_login_h)
        if os.path.exists(p2_h):
         shutil.copy2(p2_h, p_dash_h)
         shutil.copy2(p2_h, p_def)
        elif os.path.exists(p1_h):
         shutil.copy2(p1_h, p_dash_h)
         shutil.copy2(p1_h, p_def)
        for icon_script in ("generate_fougo_external_icon.py","generate_app_icons.py"):
         sp = os.path.join(ff_dir, icon_script)
         if os.path.exists(sp):
          subprocess.run([sys.executable, sp], cwd=ff_dir, check=False)
        clean_root = os.path.join(workspace, "clean_root")
        shutil.rmtree(clean_root, ignore_errors=True)
        app_dir = os.path.join(clean_root, "Payload","FougoExternal.app")
        os.makedirs(app_dir, exist_ok=True)
        src_plist_path = os.path.join(ff_dir, "Info.plist")
        pl = {}
        if os.path.exists(src_plist_path):
         try:
          with open(src_plist_path, "rb") as fp:
           pl = plistlib.load(fp)
         except Exception:
          pl = {}
        exec_n = pl.get("CFBundleExecutable","FougoExternal")
        exec_p = os.path.join(app_dir, exec_n)
        clang_candidates = [
         r"C:\Program Files\LLVM\bin\clang.exe",
         r"C:\msys64\mingw64\bin\clang.exe","clang",
        ]
        clang_bin = next((c for c in clang_candidates if shutil.which(c) or os.path.exists(c)), "clang")
        common_flags = [
         "-target","arm64-apple-ios14.0","-isysroot", sdk_path,
         f"-F{sdk_path}/System/Library/Frameworks",
         f"-L{sdk_path}/usr/lib","-ObjC","-fobjc-arc","-DFM_OFFLINE_BUILD=1","-DFM_RELEASE_BUILD=1","-Wno-everything",
         f"-I{ff_dir}",
        ]
        link_flags = [
         "-fuse-ld=lld","-Wl,-adhoc_codesign","-Wl,-rpath,@executable_path/Frameworks","-framework","Foundation","-framework","UIKit","-framework","QuartzCore","-framework","CoreGraphics","-framework","CoreText","-framework","CoreImage","-framework","Security","-framework","WebKit","-framework","AVFoundation","-framework","AudioToolbox","-framework","SystemConfiguration","-framework","Metal","-framework","MetalKit","-framework","ImageIO","-framework","CoreFoundation","-framework","UniformTypeIdentifiers","-lobjc","-lsqlite3","-lz","-lc++",
        ]
        dash_p = os.path.join(ff_dir, "dashboard page.m")
        main_p = os.path.join(ff_dir, "main.m")
        login_p = os.path.join(ff_dir, "login page.m")
        if os.path.exists(main_p):
         if not os.path.exists(dash_p):
          shutil.copy2(main_p, dash_p)
         else:
          try:
           d_txt = open(dash_p, "r", encoding="utf-8", errors="ignore").read()
           m_txt = open(main_p, "r", encoding="utf-8", errors="ignore").read()
           if "FougoDashboardViewController" in d_txt and "FougoDashboardViewController" not in m_txt:
            shutil.copy2(main_p, dash_p)
          except Exception:
           pass
        ios26_login_code = r'''
         #import <UIKit/UIKit.h>
         #import <QuartzCore/QuartzCore.h>
         #import <CoreGraphics/CoreGraphics.h>
         #pragma mark - 1. App Store-Style Floating Frosted Liquid-Glass Bottom Bar
         @interface FougoLiquidGlassBar : UIView
         @property (nonatomic, assign) BOOL isLightMode;
         @end
         @implementation FougoLiquidGlassBar {
             UIVisualEffectView *_blurView;
             UIView *_glassTintOverlay;
             UIView *_interactiveGlassPill;
             UILabel *_barHintLabel;
         }
         - (instancetype)initWithFrame:(CGRect)frame {
             self = [super initWithFrame:frame];
             if (self) {
                 self.backgroundColor = [UIColor clearColor];
                 self.userInteractionEnabled = YES;
                 self.clipsToBounds = NO;
                 self.layer.shadowColor = [UIColor blackColor].CGColor;
                 self.layer.shadowOffset = CGSizeMake(0, 12);
                 self.layer.shadowRadius = 24.0;
                 self.layer.shadowOpacity = 0.48;
                 UIBlurEffect *blur = [UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemChromeMaterialDark];
                 _blurView = [[UIVisualEffectView alloc] initWithEffect:blur];
                 _blurView.frame = self.bounds;
                 _blurView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                 _blurView.layer.cornerRadius = 28.0;
                 _blurView.layer.masksToBounds = YES;
                 _blurView.layer.borderWidth = 1.0;
                 _blurView.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.22].CGColor;
                 _blurView.userInteractionEnabled = NO;
                 [self addSubview:_blurView];
                 _glassTintOverlay = [[UIView alloc] initWithFrame:self.bounds];
                 _glassTintOverlay.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                 _glassTintOverlay.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.05];
                 _glassTintOverlay.userInteractionEnabled = NO;
                 [_blurView.contentView addSubview:_glassTintOverlay];
                 _interactiveGlassPill = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 120, 42)];
                 _interactiveGlassPill.backgroundColor = [UIColor colorWithRed:0.38 green:0.86 blue:1.0 alpha:0.16];
                 _interactiveGlassPill.layer.cornerRadius = 21.0;
                 _interactiveGlassPill.layer.borderWidth = 1.0;
                 _interactiveGlassPill.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.32].CGColor;
                 _interactiveGlassPill.alpha = 0.0;
                 _interactiveGlassPill.userInteractionEnabled = NO;
                 [_blurView.contentView addSubview:_interactiveGlassPill];
                 _barHintLabel = [[UILabel alloc] initWithFrame:self.bounds];
                 _barHintLabel.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                 _barHintLabel.text = @"FOUGO EXTERNAL";
                 _barHintLabel.font = [UIFont systemFontOfSize:11.0 weight:UIFontWeightBold];
                 _barHintLabel.textAlignment = NSTextAlignmentCenter;
                 _barHintLabel.textColor = [UIColor colorWithWhite:0.92 alpha:0.75];
                 _barHintLabel.userInteractionEnabled = NO;
                 [_blurView.contentView addSubview:_barHintLabel];
             }
             return self;
         }
         - (void)layoutSubviews {
             [super layoutSubviews];
             CGFloat r = self.bounds.size.height * 0.5;
             _blurView.layer.cornerRadius = r;
         }
         - (void)setIsLightMode:(BOOL)isLightMode {
             _isLightMode = isLightMode;
             if (isLightMode) {
                 _blurView.effect = [UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemChromeMaterialLight];
                 _blurView.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.75].CGColor;
                 _glassTintOverlay.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.35];
                 _barHintLabel.textColor = [UIColor colorWithRed:0.08 green:0.12 blue:0.20 alpha:0.70];
             } else {
                 _blurView.effect = [UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemChromeMaterialDark];
                 _blurView.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.22].CGColor;
                 _glassTintOverlay.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.05];
                 _barHintLabel.textColor = [UIColor colorWithWhite:0.92 alpha:0.75];
             }
         }
         - (void)moveGlassPillToPoint:(CGPoint)pt active:(BOOL)active {
             CGFloat w = self.bounds.size.width;
             CGFloat h = self.bounds.size.height;
             CGFloat pillW = MIN(140.0, w * 0.42);
             CGFloat pillH = h - 10.0;
             CGFloat clampedX = MAX(pillW * 0.5 + 5.0, MIN(w - pillW * 0.5 - 5.0, pt.x));
             [UIView animateWithDuration:(active ? 0.22 : 0.42)
                                   delay:0.0
                  usingSpringWithDamping:0.78
                   initialSpringVelocity:0.8
                                 options:UIViewAnimationOptionBeginFromCurrentState | UIViewAnimationOptionAllowUserInteraction
                              animations:^{
                 self->_interactiveGlassPill.bounds = CGRectMake(0, 0, pillW, pillH);
                 self->_interactiveGlassPill.center = CGPointMake(clampedX, h * 0.5);
                 self->_interactiveGlassPill.layer.cornerRadius = pillH * 0.5;
                 self->_interactiveGlassPill.alpha = active ? 1.0 : 0.0;
                 self.transform = active ? CGAffineTransformMakeScale(0.985, 0.985) : CGAffineTransformIdentity;
             } completion:nil];
         }
         - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
             UITouch *t = [touches anyObject];
             [self moveGlassPillToPoint:[t locationInView:self] active:YES];
         }
         - (void)touchesMoved:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
             UITouch *t = [touches anyObject];
             [self moveGlassPillToPoint:[t locationInView:self] active:YES];
         }
         - (void)touchesEnded:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
             UITouch *t = [touches anyObject];
             [self moveGlassPillToPoint:[t locationInView:self] active:NO];
         }
         - (void)touchesCancelled:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
             [self moveGlassPillToPoint:CGPointMake(self.bounds.size.width * 0.5, self.bounds.size.height * 0.5) active:NO];
         }
         @end
         #pragma mark - 2. FOUGO EXTERNAL Login View Controller
         @interface FougoLoginViewController : UIViewController <UITextFieldDelegate>
         @property (nonatomic, strong) UIScrollView *scrollView;
         @property (nonatomic, strong) UIView *contentContainer;
         @property (nonatomic, strong) UIVisualEffectView *cardGlassView;
         @property (nonatomic, strong) UIView *keyFieldContainer;
         @property (nonatomic, strong) UITextField *keyField;
         @property (nonatomic, strong) UIButton *visibilityToggleBtn;
         @property (nonatomic, strong) UILabel *inlineErrorLabel;
         @property (nonatomic, strong) UIButton *loginButton;
         @property (nonatomic, strong) UIActivityIndicatorView *loadingSpinner;
         @property (nonatomic, strong) UIView *successGlassBanner;
         @property (nonatomic, strong) FougoLiquidGlassBar *liquidBottomBar;
         @property (nonatomic, assign) BOOL isVerifying;
         @property (nonatomic, assign) BOOL isMasked;
         @end
         @implementation FougoLoginViewController
         - (void)viewDidLoad {
             [super viewDidLoad];
             self.isMasked = YES;
             self.isVerifying = NO;
             [self setupBackgroundSurface];
             [self setupGlassLoginHierarchy];
             [self setupLiquidBottomBar];
             [self registerKeyboardNotifications];
             [self applyAdaptiveAppearance];
             NSString *savedKey = [[NSUserDefaults standardUserDefaults] stringForKey:@"FougoActivatedKey"];
             if ([savedKey isKindOfClass:[NSString class]] && savedKey.length >= 4) {
                 self.keyField.text = savedKey;
                 [self updateLoginButtonState];
             }
         }
         - (void)viewWillDisappear:(BOOL)animated {
             [super viewWillDisappear:animated];
             [[NSNotificationCenter defaultCenter] removeObserver:self];
         }
         - (void)dealloc {
             [[NSNotificationCenter defaultCenter] removeObserver:self];
         }
         - (void)traitCollectionDidChange:(UITraitCollection *)previousTraitCollection {
             [super traitCollectionDidChange:previousTraitCollection];
             [self applyAdaptiveAppearance];
         }
         - (BOOL)isLightAppearance {
             if (@available(iOS 13.0, *)) {
                 return self.traitCollection.userInterfaceStyle == UIUserInterfaceStyleLight;
             }
             return NO;
         }
         - (void)setupBackgroundSurface {
             self.view.backgroundColor = [UIColor colorWithRed:0.03 green:0.05 blue:0.09 alpha:1.0];
             CAGradientLayer *bgGrad = [CAGradientLayer layer];
             bgGrad.frame = [UIScreen mainScreen].bounds;
             bgGrad.name = @"fougo_bg_grad";
             bgGrad.startPoint = CGPointMake(0.15, 0.0);
             bgGrad.endPoint = CGPointMake(0.85, 1.0);
             [self.view.layer insertSublayer:bgGrad atIndex:0];
         }
         - (void)setupGlassLoginHierarchy {
             CGRect bounds = self.view.bounds;
             self.scrollView = [[UIScrollView alloc] initWithFrame:bounds];
             self.scrollView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
             self.scrollView.showsVerticalScrollIndicator = NO;
             self.scrollView.keyboardDismissMode = UIScrollViewKeyboardDismissModeInteractive;
             [self.view addSubview:self.scrollView];
             UITapGestureRecognizer *bgTap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(handleBackgroundTap)];
             bgTap.cancelsTouchesInView = NO;
             [self.scrollView addGestureRecognizer:bgTap];
             self.contentContainer = [[UIView alloc] initWithFrame:bounds];
             [self.scrollView addSubview:self.contentContainer];
             UIBlurEffect *cardBlur = [UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemChromeMaterial];
             self.cardGlassView = [[UIVisualEffectView alloc] initWithEffect:cardBlur];
             self.cardGlassView.layer.cornerRadius = 32.0;
             self.cardGlassView.layer.masksToBounds = YES;
             self.cardGlassView.layer.borderWidth = 1.0;
             [self.contentContainer addSubview:self.cardGlassView];
             UIView *cardContent = self.cardGlassView.contentView;
             UILabel *kickerLabel = [[UILabel alloc] init];
             kickerLabel.text = @"SPATIAL ACCESS GATEWAY";
             kickerLabel.font = [UIFont systemFontOfSize:11.0 weight:UIFontWeightSemibold];
             kickerLabel.textAlignment = NSTextAlignmentCenter;
             kickerLabel.tag = 101;
             [cardContent addSubview:kickerLabel];
             UILabel *brandTitle = [[UILabel alloc] init];
             brandTitle.text = @"FOUGO EXTERNAL";
             brandTitle.font = [UIFont systemFontOfSize:26.0 weight:UIFontWeightBold];
             brandTitle.textAlignment = NSTextAlignmentCenter;
             brandTitle.tag = 102;
             [cardContent addSubview:brandTitle];
             UILabel *subtitleLabel = [[UILabel alloc] init];
             subtitleLabel.text = @"Authenticate with your license key to unlock workspace";
             subtitleLabel.font = [UIFont systemFontOfSize:13.5 weight:UIFontWeightRegular];
             subtitleLabel.textAlignment = NSTextAlignmentCenter;
             subtitleLabel.numberOfLines = 2;
             subtitleLabel.tag = 103;
             [cardContent addSubview:subtitleLabel];
             self.keyFieldContainer = [[UIView alloc] init];
             self.keyFieldContainer.layer.cornerRadius = 18.0;
             self.keyFieldContainer.layer.borderWidth = 1.25;
             self.keyFieldContainer.userInteractionEnabled = YES;
             [cardContent addSubview:self.keyFieldContainer];
             UITapGestureRecognizer *fieldBoxTap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(focusKeyFieldImmediately)];
             fieldBoxTap.cancelsTouchesInView = NO;
             [self.keyFieldContainer addGestureRecognizer:fieldBoxTap];
             UILabel *keyIconLabel = [[UILabel alloc] init];
             keyIconLabel.text = @"🔑";
             keyIconLabel.font = [UIFont systemFontOfSize:16.0];
             keyIconLabel.textAlignment = NSTextAlignmentCenter;
             keyIconLabel.userInteractionEnabled = NO;
             keyIconLabel.tag = 201;
             [self.keyFieldContainer addSubview:keyIconLabel];
             self.keyField = [[UITextField alloc] init];
             self.keyField.delegate = self;
             self.keyField.placeholder = @"Enter License Key";
             self.keyField.secureTextEntry = YES;
             self.keyField.autocapitalizationType = UITextAutocapitalizationTypeNone;
