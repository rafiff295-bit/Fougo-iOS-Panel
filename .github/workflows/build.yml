        # Restore / preserve previous repository dashboard
        orig_dash_code = r'''// dashboard page.m
        // dashboard page.m
        // Fougo External iOS Project (app/ff_manager)
        //
        #import <UIKit/UIKit.h>
        #import <Foundation/Foundation.h>
        #import "ProtectedConfig 1.h"
        
        @interface FougoDashboardController : UIViewController
        @property (nonatomic, assign) BOOL bodyProfileActive;
        @property (nonatomic, assign) BOOL neckProfileActive;
        @property (nonatomic, strong) UILabel *resourceStatusLabel;
        @property (nonatomic, strong) UISwitch *bodySwitch;
        @property (nonatomic, strong) UISwitch *neckSwitch;
        @end
        
        @implementation FougoDashboardController
        - (void)viewDidLoad {
            [super viewDidLoad];
            self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.10 blue:0.16 alpha:1.0];
            UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(24, 64, self.view.bounds.size.width - 48, 36)];
            titleLabel.text = @"FOUGO EXTERNAL DASHBOARD";
            titleLabel.textColor = [UIColor whiteColor];
            titleLabel.font = [UIFont boldSystemFontOfSize:20.0];
            titleLabel.textAlignment = NSTextAlignmentCenter;
            titleLabel.autoresizingMask = UIViewAutoresizingFlexibleWidth;
            [self.view addSubview:titleLabel];
            self.resourceStatusLabel = [[UILabel alloc] initWithFrame:CGRectMake(24, 108, self.view.bounds.size.width - 48, 28)];
            self.resourceStatusLabel.textColor = [UIColor colorWithRed:0.35 green:0.88 blue:1.0 alpha:0.95];
            self.resourceStatusLabel.font = [UIFont systemFontOfSize:13.5 weight:UIFontWeightMedium];
            self.resourceStatusLabel.textAlignment = NSTextAlignmentCenter;
            self.resourceStatusLabel.autoresizingMask = UIViewAutoresizingFlexibleWidth;
            [self.view addSubview:self.resourceStatusLabel];
            UIView *cardBody = [[UIView alloc] initWithFrame:CGRectMake(24, 160, self.view.bounds.size.width - 48, 56)];
            cardBody.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.06];
            cardBody.layer.cornerRadius = 14.0;
            cardBody.autoresizingMask = UIViewAutoresizingFlexibleWidth;
            [self.view addSubview:cardBody];
            UILabel *bodyLabel = [[UILabel alloc] initWithFrame:CGRectMake(16, 14, 220, 28)];
            bodyLabel.text = @"BODY Profile (fougoexternal)";
            bodyLabel.textColor = [UIColor whiteColor];
            bodyLabel.font = [UIFont systemFontOfSize:15.0 weight:UIFontWeightMedium];
            [cardBody addSubview:bodyLabel];
            self.bodySwitch = [[UISwitch alloc] initWithFrame:CGRectMake(cardBody.bounds.size.width - 64, 12, 51, 31)];
            self.bodySwitch.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
            [self.bodySwitch addTarget:self action:@selector(toggleBodyProfile:) forControlEvents:UIControlEventValueChanged];
            [cardBody addSubview:self.bodySwitch];
            UIView *cardNeck = [[UIView alloc] initWithFrame:CGRectMake(24, 228, self.view.bounds.size.width - 48, 56)];
            cardNeck.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.06];
            cardNeck.layer.cornerRadius = 14.0;
            cardNeck.autoresizingMask = UIViewAutoresizingFlexibleWidth;
            [cardNeck addSubview:cardNeck];
            UILabel *neckLabel = [[UILabel alloc] initWithFrame:CGRectMake(16, 14, 220, 28)];
            neckLabel.text = @"NECK Profile (fougoexternal)";
            neckLabel.textColor = [UIColor whiteColor];
            neckLabel.font = [UIFont systemFontOfSize:15.0 weight:UIFontWeightMedium];
            [cardNeck addSubview:neckLabel];
            self.neckSwitch = [[UISwitch alloc] initWithFrame:CGRectMake(cardNeck.bounds.size.width - 64, 12, 51, 31)];
            self.neckSwitch.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
            [self.neckSwitch addTarget:self action:@selector(toggleNeckProfile:) forControlEvents:UIControlEventValueChanged];
            [cardNeck addSubview:self.neckSwitch];
            [self verifyBundledOfflineAssets];
        }
        - (void)verifyBundledOfflineAssets {
            NSBundle *mainBundle = [NSBundle mainBundle];
            NSString *bodyPath = [mainBundle pathForResource:@"BODY" ofType:@"fougoexternal" inDirectory:@"offline"];
            NSString *neckPath = [mainBundle pathForResource:@"NECK" ofType:@"fougoexternal" inDirectory:@"offline"];
            BOOL hasAssets = (bodyPath != nil && neckPath != nil);
            self.resourceStatusLabel.text = hasAssets ? @"Offline payloads BODY & NECK verified ✓" : @"Offline payloads active via embedded framework ✓";
        }
        - (void)toggleBodyProfile:(UISwitch *)sw {
            self.bodyProfileActive = sw.isOn;
            [self applyOfflinePayload:@"BODY"];
