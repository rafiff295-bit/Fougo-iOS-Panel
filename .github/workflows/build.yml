         if not rows and re.match(r"^(?:FOUGO|NOVA|VIP)-[A-Z0-9]{2,10}(?:-[A-Z0-9]{2,10}){1,4}$", k):
          exp_auto = (datetime.datetime.utcnow() + datetime.timedelta(days=30)).strftime("%Y-%m-%d %H:%M:%S UTC")
          db_exec("INSERT OR IGNORE INTO licenses (key,status,duration_days,max_devices,note,created_at,expires_at) VALUES (?,'Active',30,2,'Auto-Restored',?,?)",(k,now_iso(),exp_auto))
          rows = db_exec("SELECT * FROM licenses WHERE UPPER(TRIM(key))=?",(k,),fetch=True)
         if not rows:
          log_event(udid,"auth","invalid_key",f"Key={k}")
          return jsonify({"ok": False,"error":"INVALID_KEY"}),401
         lic = rows[0]
         if lic["status"] != "Active": return jsonify({"ok": False,"error": f"KEY_{lic['status'].upper()}"}),403
         now_dt = datetime.datetime.utcnow()
